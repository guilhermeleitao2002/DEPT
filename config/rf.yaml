# ===================================
# ADEPT — Random Forest base learner
# ===================================
# Binary classifier (benign vs attack) over the 24-dim aggregated window
# statistics produced by the Packet-to-Tensor pipeline.

tensors_dir: data/tensors
output_dir: data/models/rf

# All 16 attacks currently in data/tensors/.
attacks:
  - active_wiretap
  - arp_mitm
  - brute_force_ftp
  - brute_force_ssh
  - ddos
  - dos_slow
  - fuzzing
  - infiltration
  - mirai
  - os_scan
  - portscan
  - ssdp_flood
  - ssl_renegotiation
  - syn_dos
  - video_injection
  - web_attacks

# Split
split:
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  seed: 42

# Benign capping: per-attack benign windows ≤ benign_cap_ratio × attack windows
# (prevents high-benign datasets from dominating the global benign pool).
benign_cap_ratio: 3.0

# Drop windows whose label_str is 'unknown' (case-insensitive).
drop_unknown: true

# Random Forest defaults (grid search overrides n_estimators / max_depth / min_samples_leaf).
rf_defaults:
  n_estimators: 300
  max_depth: null
  min_samples_leaf: 2
  max_features: sqrt
  n_jobs: -1
  class_weight: balanced_subsample
  random_state: 42

# Small validation grid. Set enabled: false to skip and use rf_defaults only.
grid_search:
  enabled: true
  scoring: macro_f1
  n_estimators: [200, 400]
  max_depth: [null, 20, 40]
  min_samples_leaf: [1, 2, 5]
