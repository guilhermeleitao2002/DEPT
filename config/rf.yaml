# ===================================
# ADEPT — Random Forest base learner
# ===================================
# Binary classifier (benign vs adversarial) over the 24-dim aggregated
# window statistics produced by the Packet-to-Tensor pipeline.
#
# Under ADEPT's dataset-driven label convention, every Kitsune/CIC-IDS2017
# window is benign and every TANTGen-generated window is adversarial. The
# RF learns to distinguish the benign manifold from adversarial
# perturbations — the upstream NIDS is expected to handle the raw-dataset
# attacks, so they contribute to the benign class here.

tensors_dir: data/tensors
adversarial_dir: data/tensors/adversarial   # auto-discovered: every subdir with metadata.json
output_dir: data/models/rf

# Benign pool — restricted to the 5 attacks for which TANTGen adversarial
# PCAPs exist on disk (brute_force, ddos, mirai, portscan, ssdp_flood).
# Excluded sources and reasons:
#   dos_slow, syn_dos  — no TANTGen adversarial PCAP on disk for this set
#   active_wiretap, arp_mitm, brute_force_ftp, brute_force_ssh,
#   infiltration, os_scan, ssl_renegotiation, video_injection, web_attacks
#                      — no TANTGen adversarial counterpart; including them
#                        inflates the benign class without a matching signal
benign_sources:
  - brute_force
  - ddos
  - mirai
  - portscan
  - ssdp_flood

# Adversarial pool — every subdirectory of adversarial_dir/ that contains
# metadata.json is loaded automatically, except those listed below.
# - portscan_adv_*  : PortScan flows are 1–2 packets each (one SYN ± one
#   RST), and TANTGen perturbs timing/size without adding packets, so 0
#   flows out of 15,839 reach N=10 — empirically 0 windows. Excluded to
#   keep the adversarial pool clean.
# - dos_slow / syn_dos / fuzzing : defensively drops leftover tensors
#   from attack sets no longer part of this configuration.
# - brute_force_kitsune / portscan_kitsune *_adv_* : defensive guard against
#   tensors that would only exist if process_all_attacks.py's TANTGEN_KEYS
#   filter were bypassed. Currently only ddos_kitsune is opted in.
adversarial_exclude:
  # - portscan_adv_both
  # - portscan_adv_iat
  # - portscan_adv_size
  - dos_slow_adv_both
  - dos_slow_adv_iat
  - dos_slow_adv_size
  - syn_dos_adv_both
  - syn_dos_adv_iat
  - syn_dos_adv_size
  - fuzzing_adv_both
  - fuzzing_adv_iat
  - fuzzing_adv_size
  - brute_force_kitsune_adv_both
  - brute_force_kitsune_adv_iat
  - brute_force_kitsune_adv_size
  - portscan_kitsune_adv_both
  - portscan_kitsune_adv_iat
  - portscan_kitsune_adv_size

# Split (flow-atomic, stratified by source).
split:
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  seed: 42

# Benign capping: total benign *flows* ≤ benign_cap_ratio × adversarial
# *flows* (applied globally before the per-checkpoint expansion).
# Prevents the much larger benign pool from dominating training.
benign_cap_ratio: 3.0

# Safety net — should never fire since attach_labels.py writes only
# "benign" or "adversarial" label_str values.
drop_unknown: true

rf_defaults:
  n_estimators: 300
  max_depth: null
  min_samples_leaf: 2
  max_features: sqrt
  n_jobs: -1
  class_weight: balanced_subsample
  random_state: 42

grid_search:
  enabled: true
  scoring: macro_f1
  n_estimators: [200, 400]
  max_depth: [null, 20, 40]
  min_samples_leaf: [1, 2, 5]
