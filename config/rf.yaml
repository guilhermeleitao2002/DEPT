# ===================================
# DEPT — Random Forest base learner
# ===================================
# Binary classifier (benign vs adversarial) over the 24-dim prefix statistics,
# one row per RF checkpoint.
#
# Every Kitsune / CIC-IDS2017 / CIC-DDoS-2019 flow is benign and every TANTGen
# flow is adversarial: the protected NIDS already handles the original attacks.

tensors_dir: data/tensors
adversarial_dir: data/tensors/adversarial   # auto-discovered: every subdir with metadata.json
output_dir: data/models/rf

# Benign pool: the 10 attacks that have TANTGen adversarial versions. The
# CIC-DDoS-2019 sources are the first 1,000,000 packets of each capture (they
# have no clean attack time window).
benign_sources:
  - brute_force
  - ddos
  - mirai
  - portscan
  - ssdp_flood
  - dns_ddos
  - ldap_ddos
  - ntp_ddos
  - ssdp_ddos
  - syn_ddos

# Adversarial pool: every subdirectory of adversarial_dir/ with a metadata.json,
# except the ones below (leftovers from attack sets that are no longer used).
adversarial_exclude:
  - dos_slow_adv_both
  - dos_slow_adv_iat
  - dos_slow_adv_size
  - syn_dos_adv_both
  - syn_dos_adv_iat
  - syn_dos_adv_size
  - fuzzing_adv_both
  - fuzzing_adv_iat
  - fuzzing_adv_size
  - brute_force_kitsune_adv_both
  - brute_force_kitsune_adv_iat
  - brute_force_kitsune_adv_size
  - portscan_kitsune_adv_both
  - portscan_kitsune_adv_iat
  - portscan_kitsune_adv_size

# Flow-level split, stratified by source.
split:
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  seed: 42

# At most benign_cap_ratio × as many benign flows as adversarial flows (no
# effect on the current data, where benign flows are the minority).
benign_cap_ratio: 3.0

rf_defaults:
  n_estimators: 300
  max_depth: null
  min_samples_leaf: 2
  max_features: sqrt
  n_jobs: -1
  class_weight: balanced_subsample
  random_state: 42

grid_search:
  enabled: true
  n_estimators: [200, 400]
  max_depth: [null, 20, 40]
  min_samples_leaf: [1, 2, 5]
