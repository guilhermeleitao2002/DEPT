# ===================================
# DEPT — TCN base learner
# ===================================
# Binary classifier (benign vs adversarial) over the variable-length per-flow
# [L, 1090] packet sequences, with one prediction per packet. Same sources and
# split as config/rf.yaml.

tensors_dir: data/tensors
adversarial_dir: data/tensors/adversarial   # auto-discovered: every subdir with metadata.json
output_dir: data/models/tcn

# Benign pool: same as rf.yaml.
benign_sources:
  - brute_force
  - ddos
  - mirai
  - portscan
  - ssdp_flood
  - dns_ddos
  - ldap_ddos
  - ntp_ddos
  - ssdp_ddos
  - syn_ddos

# Adversarial pool: same as rf.yaml.
adversarial_exclude:
  - dos_slow_adv_both
  - dos_slow_adv_iat
  - dos_slow_adv_size
  - syn_dos_adv_both
  - syn_dos_adv_iat
  - syn_dos_adv_size
  - fuzzing_adv_both
  - fuzzing_adv_iat
  - fuzzing_adv_size
  - brute_force_kitsune_adv_both
  - brute_force_kitsune_adv_iat
  - brute_force_kitsune_adv_size
  - portscan_kitsune_adv_both
  - portscan_kitsune_adv_iat
  - portscan_kitsune_adv_size

# Flow-level split, stratified by source (same seed as rf.yaml).
split:
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  seed: 42

# Same benign cap as rf.yaml.
benign_cap_ratio: 3.0

# ---- TCN architecture ----
# 3 dilated temporal blocks of 128 channels (~0.8M params), receptive field
# 29 packets, and a per-packet Conv1d head giving [B, T, 2] logits.
model:
  num_features: 1090       # 1088 nPrint bits + IPAT (z-score) + Direction
  channels: [128, 128, 128]
  kernel_size: 3
  dropout: 0.15
  num_classes: 2

# ---- Training ----
# Per-packet cross-entropy, averaged inside each flow and then across flows.
training:
  device: auto             # auto | cuda | cuda:0 | cuda:1 | cpu
  epochs: 20
  batch_size: 32           # small because flows can be hundreds of packets long
  num_workers: auto        # auto | <int> — auto = min(16, cpu_count // 2)
  lr: 1.0e-3
  weight_decay: 1.0e-4
  scheduler: cosine        # cosine | plateau
  early_stop_patience: 3
  amp: true                # mixed precision (only effective when device=cuda)
  class_weight: balanced   # balanced | none — mirrors sklearn's 'balanced'
  max_length: 200          # truncate flows at 200 packets to bound padded batch size
  seed: 42
