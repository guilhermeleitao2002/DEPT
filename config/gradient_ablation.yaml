# =====================================================================
# DEPT — Gradient-guided evasion (RQ1)
# =====================================================================
# A white-box attack on the TCN whose perturbation is scored, unchanged, on the
# RF, the TCN and the RF+TCN+meta-learner stack.
#
#   python3 scripts/gradient_ablation/run_gradient_ablation.py                  # all sources
#   python3 scripts/gradient_ablation/run_gradient_ablation.py --attack mirai   # one attack
#
# Phase 7 of run_pipeline.sh (global mode only). Needs the trained RF, TCN and
# meta-learner and the TANTGen PCAPs under data/adversarial/ (used to recompute
# the per-packet RF features, see src/models/gradient_ablation/features.py).

# ---- Data ----
tensors_dir: data/tensors
adversarial_dir: data/tensors/adversarial     # tensorized TANTGen sources
adversarial_pcap_dir: data/adversarial        # TANTGen PCAPs (phase 1 output)
output_dir: data/models/gradient_ablation
min_len: 2

# ---- Trained targets ----
rf_model_dir: data/models/rf
tcn_model_dir: data/models/tcn
metalearner_model_dir: data/models/metalearner

# ---- Benign reference (matched-FPR thresholds) ----
# Unperturbed benign flows, scored by each target to set thresholds at the same
# false-positive rate (the targets are calibrated very differently, so a fixed
# 0.5 would not compare them fairly). Same benign pool as rf.yaml.
benign_sources:
  - brute_force
  - ddos
  - mirai
  - portscan
  - ssdp_flood
  - dns_ddos
  - ldap_ddos
  - ntp_ddos
  - ssdp_ddos
  - syn_ddos
benign_flows_per_source: 200
fpr_grid: [0.01, 0.05, 0.10]
report_policy: fpr_0.05        # threshold policy used for the headline curves/plot

# ---- Flow selection ----
# Sampled per source from the base learners' test split (source sizes differ by
# orders of magnitude). With n=300 the per-source ASR 95% CI is about +/-5.7 points.
flows_per_source: 300
seed: 42

# ---- Attacker budget grid ----
# In physical units (see src/models/gradient_ablation/attack.py):
#   `bytes`   — max padding per packet (increase-only, capped at the MTU)
#   `seconds` — max added delay per packet (increase-only)
# b0 is the delta=0 control. The smallest delay is above one float32 ULP of the
# z-scored IPAT channel, below which delays round to zero.
budgets:
  - {id: b0,    bytes: 0,    seconds: 0}
  - {id: b8,    bytes: 8,    seconds: 0.00001}
  - {id: b32,   bytes: 32,   seconds: 0.0001}
  - {id: b128,  bytes: 128,  seconds: 0.001}
  - {id: b512,  bytes: 512,  seconds: 0.01}
  - {id: b1460, bytes: 1460, seconds: 0.1}

# ---- Attack ----
attack:
  steps: 40
  alpha_ratio: 2.5           # step = alpha_ratio * budget / steps (Madry et al.)
  random_init: true
  restarts: 8                # restart 0 starts at delta=0, the others at random
  variants: [pgd, random]    # random search with the same budget and number of
                             # queries; results use `best` (the better of the two)
  objective: final           # final | max | mean
                             # final: verdict after the whole flow; max: never fires
  tl_cap: 1500               # MTU
  pad_byte_mode: random      # random | zero padding bytes (TANTGen pads with random
                             # bytes, realize.py with zeros); changes Payload_Entropy
  autopgd_check: true        # ART AutoPGD on the relaxed problem (upper bound only)

# ---- Runtime ----
device: auto                 # auto | cuda | cuda:0 | cuda:1 | cpu
batch_size: 32
max_length: 200              # truncate flows at 200 packets (matches the TCN)
threshold: 0.5               # used only for the never-fires (streaming) metric

# ---- Excludes ----
adversarial_exclude:
  - brute_force_kitsune_adv_both
  - brute_force_kitsune_adv_iat
  - brute_force_kitsune_adv_size
  - portscan_kitsune_adv_both
  - portscan_kitsune_adv_iat
  - portscan_kitsune_adv_size
