# ===================================
# ADEPT — Packet-to-Tensor Pipeline
# ===================================
# Uses nPrint bit-level encoding (Holland et al., CCS 2021) for rich
# per-packet header representation, inspired by FlowPaint (SIGCOMM'26).

# --------------------------
# N-Packet Window parameters
# --------------------------
window_size: 10            # N packets per flow window (N-Packet Snapshot)
window_stride: 10          # non-overlapping windows (stride = window_size)

# --------------------------
# nPrint identity masking
# --------------------------
# Following FlowPaint §3.3.2: zero out high-entropy identity fields
# to prevent overfitting to flow identity (IPs, ports, IP ID).
# These column prefixes are masked in the nPrint bit matrix.
mask_prefixes:
  - ipv4_src
  - ipv4_dst
  - ipv4_id
  - tcp_sprt
  - tcp_dprt
  - udp_sport
  - udp_dport

# --------------------------
# Aggregated statistics (for Random Forest)
# --------------------------
# Computed from Scapy-derived metadata (not nPrint bits) over each
# N-packet window. Each base feature generates len(rf_agg_functions) stats.
# This preserves ensemble diversity: TCN sees bit-level features,
# RF sees statistical aggregates.
rf_agg_functions:
  - mean
  - std
  - min
  - max

rf_base_features:
  - IPAT
  - Packet_Size
  - Payload_Length
  - Payload_Entropy
  - TCP_Flags
  - Direction

# --------------------------
# Standardization
# --------------------------
# Only IPAT needs z-score normalization.
# nPrint bits are already bounded {-1, 0, 1}; Direction is binary.
mean_std_filename: mean_std.json

standardize_columns:
  - IPAT

# --------------------------
# I/O defaults
# --------------------------
default_output_dir: data/processed/
