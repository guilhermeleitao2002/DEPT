# ===================================
# ADEPT — Packet-to-Tensor Pipeline
# ===================================

# --------------------------
# N-Packet Window parameters
# --------------------------
window_size: 10            # N packets per flow window (N-Packet Snapshot)
window_stride: 10          # non-overlapping windows (stride = window_size)

# --------------------------
# Per-packet features (raw sequence for TCN / Transformer)
# --------------------------
# These are the per-packet header fields extracted and kept in the sequence tensor.
# The order here defines the column order in the output tensor.
sequence_features:
  - IPAT               # Inter-Packet Arrival Time (within flow)
  - Packet_Size         # Frame length in bytes
  - Protocol            # IP protocol number (TCP=6, UDP=17, ...)
  - TCP_Flags           # TCP flags as integer (0 if not TCP)
  - Payload_Length      # IP payload length
  - Payload_Entropy     # Shannon entropy of payload bytes
  - Direction           # 1 = forward (src→dst), 0 = reverse (dst→src)

# --------------------------
# Aggregated statistics (for Random Forest)
# --------------------------
# Computed over each N-packet window. Each base feature generates 4 stats.
rf_agg_functions:
  - mean
  - std
  - min
  - max

rf_base_features:
  - IPAT
  - Packet_Size
  - Payload_Length
  - Payload_Entropy
  - TCP_Flags
  - Direction

# --------------------------
# Standardization
# --------------------------
# Path where mean/std JSON is saved/loaded (relative to output dir)
mean_std_filename: mean_std.json

# Columns to z-score standardize in the sequence tensor
standardize_columns:
  - IPAT
  - Packet_Size
  - Payload_Length
  - Payload_Entropy

# --------------------------
# I/O defaults
# --------------------------
default_output_dir: data/processed/
