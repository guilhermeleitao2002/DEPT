# ===================================
# DEPT — Packet-to-Tensor Pipeline
# ===================================
# Writes ragged per-flow tensors:
#   flow_packets.npy           [P_total, 1090] float32  nPrint bits + IPAT (z-score) + Direction
#   flow_offsets.npy           [N_flows, 2]    int64    (start, length)
#   rf_checkpoints.npy         [C_total, 24]   float32  RF prefix statistics
#   rf_checkpoint_offsets.npy  [N_flows, 2]    int64    (start, n_checkpoints)
#
# Packet headers use the nPrint bit-level encoding (Holland et al., CCS 2021).

# --------------------------
# RF checkpoint cadence
# --------------------------
#   rf_first_checkpoint  — packet index of an extra early checkpoint, so that
#                          short flows (PortScan has ~2 packets) also get an RF
#                          prediction (0 disables it).
#   rf_checkpoint_stride — one checkpoint every K packets.
#
# {first=2, stride=10} gives checkpoints at packets {2, 10, 20, 30, …}, each
# over the flow's prefix up to that packet.
rf_first_checkpoint: 2
rf_checkpoint_stride: 10

# --------------------------
# nPrint identity masking
# --------------------------
# Identity fields set to zero in the nPrint bits (as in FlowPaint), so the
# models cannot learn hosts and ports.
mask_prefixes:
  - ipv4_src
  - ipv4_dst
  - ipv4_id
  - tcp_sprt
  - tcp_dprt
  - udp_sport
  - udp_dport

# --------------------------
# Aggregated statistics (for Random Forest)
# --------------------------
# Each base feature gives len(rf_agg_functions) statistics over the flow's
# prefix. The TCN sees the per-packet sequence; the RF sees these summaries.
rf_agg_functions:
  - mean
  - std
  - min
  - max

rf_base_features:
  - IPAT
  - Packet_Size
  - Payload_Length
  - Payload_Entropy
  - TCP_Flags
  - Direction

# --------------------------
# Standardization
# --------------------------
# Only IPAT is z-scored; nPrint bits are {-1, 0, 1} and Direction is binary.
mean_std_filename: mean_std.json

standardize_columns:
  - IPAT
