# =====================================================================
# DEPT — Deployment baseline (protected-NIDS "before vs after DEPT")
# =====================================================================
# Scores the clean, TANTGen and DEPT-defended streams with the NIDS each attack
# was built to evade. In the defended stream only the flows flagged by the
# meta-learner are purified.
#
#   python3 scripts/baseline/run_baseline.py                 # all attacks
#   python3 scripts/baseline/run_baseline.py --attacks mirai,ddos
#
# Needs the trained RF, TCN, meta-learner and reconstructor, and the TANTGen repo
# (Kitsune AfterImage .so, NIDS models, vendored cicflowmeter).

# ---- Data ----
tensors_dir: data/tensors
adversarial_dir: data/tensors/adversarial     # tensorized adversarial sources
adversarial_pcap_dir: data/adversarial        # original TANTGen PCAPs (phase 1 output)
min_len: 2

# ---- Trained DEPT models ----
rf_model_dir: data/models/rf
tcn_model_dir: data/models/tcn
metalearner_model_dir: data/models/metalearner   # the detector that gates purification
reconstructor_model_dir: data/models/reconstructor

output_dir: data/models/baseline

# ---- Gated pipeline ----
detector_threshold: 0.5      # flow is "adversarial" (→ purified) when P(adv) >= this
score_purified_all: true     # also score the all-flows-purified stream (perfect-detector upper bound)
score_test_subset: true      # also report the DEPT-defended stream on held-out test flows

# ---- Meta-learner token config (must match how the meta-learner was trained) ----
token:
  rf_age_clip: 30
  pkt_len_norm: 1500

# ---- Runtime ----
device: auto                 # auto | cuda | cuda:0 | cpu
batch_size: 32
num_workers: auto
max_length: 200              # truncate flows at 200 packets (matches the other models)

# ---- Excludes (same as reconstructor.yaml) ----
adversarial_exclude:
  - dos_slow_adv_both
  - dos_slow_adv_iat
  - dos_slow_adv_size
  - syn_dos_adv_both
  - syn_dos_adv_iat
  - syn_dos_adv_size
  - fuzzing_adv_both
  - fuzzing_adv_iat
  - fuzzing_adv_size
  - brute_force_kitsune_adv_both
  - brute_force_kitsune_adv_iat
  - brute_force_kitsune_adv_size
  - portscan_kitsune_adv_both
  - portscan_kitsune_adv_iat
  - portscan_kitsune_adv_size

# ---- Independent NIDS (keep in sync with reconstructor.yaml) ----
nids:
  enabled: true
  tantgen_root: ../Transformer-based_Adversarial_Network_Traffic_Generator
  default_ml_model: RF
  ml_nids_model_dir: src/NIDS/models       # under tantgen_root; <Attack>_<MODEL>.joblib
  attacks:
    mirai:       {kind: kitsune, model: src/Kitsune/models/Mirai_model.pkl}
    ssdp_flood:  {kind: kitsune, model: src/Kitsune/models/SSDP_Flood_model.pkl}
    ddos:        {kind: ml_nids, tg_attack: DDoS}
    portscan:    {kind: ml_nids, tg_attack: PortScan}
    brute_force: {kind: ml_nids, tg_attack: BruteForce}
    dns_ddos:    {kind: ml_nids, tg_attack: DNS_DDoS}
    ldap_ddos:   {kind: ml_nids, tg_attack: LDAP_DDoS}
    ntp_ddos:    {kind: ml_nids, tg_attack: NTP_DDoS}
    ssdp_ddos:   {kind: ml_nids, tg_attack: SSDP_DDoS}
    syn_ddos:    {kind: ml_nids, tg_attack: SYN_DDoS}
  kitsune:
    model_dir: data/models/kitsune
    benign_pcap_dir: data/original/Kitsune/Benign
    base_to_tg: {mirai: Mirai, ssdp_flood: SSDP_Flood}
    fm_grace: 5000
    ad_grace: 50000
    train_cap_packets: 55000
    detection: max
    seed: 42
