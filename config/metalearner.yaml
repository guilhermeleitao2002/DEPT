# =====================================================================
# DEPT — Mini-Transformer Meta-Learner
# =====================================================================
# Trains on the base learners' val split, divided into meta-train/meta-val
# (seed 43) for early stopping, and is evaluated on the test split.

tensors_dir: data/tensors
adversarial_dir: data/tensors/adversarial
output_dir: data/models/metalearner

# Trained base learners: rf.joblib + dataset.npz + split.npz (RF) and
# tcn.pt + dataset_index.npz + tcn_config.json (TCN).
rf_model_dir: data/models/rf
tcn_model_dir: data/models/tcn

meta_split:
  meta_val_frac: 0.15
  seed: 43

token:
  pkt_len_norm: 1500.0
  rf_age_clip: 30        # raw packets since last RF emission, clipped

model:
  d_model: 64
  n_layers: 2
  n_heads: 4
  dim_feedforward: 128
  dropout: 0.1
  num_classes: 2
  max_seq_len: 200

training:
  device: auto               # auto | cuda | cuda:0 | cuda:1 | cpu
  epochs: 20
  batch_size: 128
  num_workers: auto          # auto | <int> — auto = min(16, cpu_count // 2)
  lr: 3.0e-4
  weight_decay: 1.0e-4
  amp: true
  class_weight: balanced
  # Auxiliary loss: per-packet ReLU(p_best_base - p_meta) on the confidence in
  # the true class, with p_best_base = max(p_RF, p_TCN) (p_TCN before the first
  # RF checkpoint). It raised the detection rate by ~1 point but did not change
  # AUROC@t. 0 disables it.
  aux_weight: 0.5
  early_stop_t: 10           # AUROC@10 on meta-val drives early stopping
  early_stop_patience: 5
  max_length: 200            # truncate long flows for tokenisation
