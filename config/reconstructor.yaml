# =====================================================================
# DEPT — Reconstructor (Purification) Transformer
# =====================================================================
# A small causal residual denoiser that undoes TANTGen's timing (IPAT) and size
# (IPv4 length) changes. Trained on (adversarial, clean) flow pairs matched by
# 5-tuple, with a flow-level split (seed 42).

tensors_dir: data/tensors
adversarial_dir: data/tensors/adversarial   # auto-discovered: every subdir with metadata.json
output_dir: data/models/reconstructor

# TCN used for the purification-gain sanity check.
tcn_model_dir: data/models/tcn

# Sources without a clean base folder are skipped; same excludes as rf.yaml.
adversarial_exclude:
  - dos_slow_adv_both
  - dos_slow_adv_iat
  - dos_slow_adv_size
  - syn_dos_adv_both
  - syn_dos_adv_iat
  - syn_dos_adv_size
  - fuzzing_adv_both
  - fuzzing_adv_iat
  - fuzzing_adv_size
  - brute_force_kitsune_adv_both
  - brute_force_kitsune_adv_iat
  - brute_force_kitsune_adv_size
  - portscan_kitsune_adv_both
  - portscan_kitsune_adv_iat
  - portscan_kitsune_adv_size

# Drop pairs shorter than this (a timing change needs at least one interval).
min_len: 2

# Flow-level split, stratified by adversarial source.
split:
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  seed: 42

# ---- Reconstructor architecture ----
# Causal transformer encoder with a residual head (identity by default).
model:
  num_features: 1090       # 1088 nPrint bits + IPAT (z-score) + Direction
  d_model: 128
  n_layers: 3
  n_heads: 4
  dim_feedforward: 256
  dropout: 0.1
  max_seq_len: 200

# ---- Training ----
# Smooth-L1 to the clean flow, averaged within each flow, masked over padding.
training:
  device: auto             # auto | cuda | cuda:0 | cuda:1 | cpu
  epochs: 20
  batch_size: 32
  num_workers: auto        # auto | <int> — auto = min(16, cpu_count // 2)
  lr: 3.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine        # cosine | plateau
  early_stop_patience: 3
  amp: true
  max_length: 200          # truncate flows at 200 packets to bound padded batch size
  seed: 42

# ---- Traffic-space realization + protocol compliance ----
# Writes the purified length/timing onto the original adversarial packets and
# checks them with tshark (skipped if the PCAPs or tshark are missing).
realize:
  adversarial_pcap_dir: data/adversarial   # original TANTGen PCAPs (phase 1 output)

# ---- Independent NIDS ----
# The adv / purified / clean packets are scored by the NIDS each attack was built
# to evade (shared with the deployment baseline):
#   * Kitsune (KitNET + AfterImage) for mirai and ssdp_flood, with TANTGen's models;
#   * TANTGen's ML-NIDS (CICFlowMeter flow classifiers) for the 8 CIC attacks.
# Kitsune needs TANTGen's compiled AfterImage .so and Cython; ML-NIDS needs
# TANTGen's vendored cicflowmeter. A source whose NIDS is missing is skipped.
nids:
  enabled: true
  tantgen_root: ../Transformer-based_Adversarial_Network_Traffic_Generator
  default_ml_model: RF                 # ML-NIDS classifier: RF | LR | SVM | MLP
  ml_nids_model_dir: src/NIDS/models   # under tantgen_root; <Attack>_<MODEL>.joblib
  # Per-attack NIDS map (base attack -> the NIDS it was built to evade).
  attacks:
    mirai:       {kind: kitsune, model: src/Kitsune/models/Mirai_model.pkl}
    ssdp_flood:  {kind: kitsune, model: src/Kitsune/models/SSDP_Flood_model.pkl}
    ddos:        {kind: ml_nids, tg_attack: DDoS}
    portscan:    {kind: ml_nids, tg_attack: PortScan}
    brute_force: {kind: ml_nids, tg_attack: BruteForce}
    dns_ddos:    {kind: ml_nids, tg_attack: DNS_DDoS}
    ldap_ddos:   {kind: ml_nids, tg_attack: LDAP_DDoS}
    ntp_ddos:    {kind: ml_nids, tg_attack: NTP_DDoS}
    ssdp_ddos:   {kind: ml_nids, tg_attack: SSDP_DDoS}
    syn_ddos:    {kind: ml_nids, tg_attack: SYN_DDoS}
  # Kitsune-specific knobs (calibration fallback + per-flow RMSE aggregation).
  kitsune:
    model_dir: data/models/kitsune               # DEPT cache for calibrated fallbacks
    benign_pcap_dir: data/original/Kitsune/Benign # under tantgen_root; <TG>_benign.pcap
    base_to_tg: {mirai: Mirai, ssdp_flood: SSDP_Flood}
    fm_grace: 5000            # AfterImage feature-map grace (TANTGen protocol)
    ad_grace: 50000           # autoencoder-training grace
    train_cap_packets: 55000  # cap benign feature extraction (>= fm+ad)
    detection: max            # per-flow RMSE aggregation: max | mean
    seed: 42
