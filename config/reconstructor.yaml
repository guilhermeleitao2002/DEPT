# =====================================================================
# DEPT — Reconstructor (Purification) Transformer
# =====================================================================
# A small causal (decoder-only) residual denoiser. When the ensemble flags
# a flow as adversarial, the reconstructor maps it back onto the clean-traffic
# manifold, undoing TANTGen's timing (IPAT) and size (IPv4 length) perturbations.
#
# Trained on matched (adversarial → clean) flow pairs, paired by 5-tuple over
# the same data the other models use. Uses the seed=42 flow-level split so the
# test pairs are held out.

tensors_dir: data/tensors
adversarial_dir: data/tensors/adversarial   # auto-discovered: every subdir with metadata.json
output_dir: data/models/reconstructor

# Source the trained TCN from here — used as the "protected NIDS" for the
# purification-gain metric (P(adv) on adversarial vs reconstructed vs clean).
tcn_model_dir: data/models/tcn

# Adversarial sources with no clean base folder are skipped automatically.
# List any further sources to exclude here; this mirrors the carry-over
# excludes in tcn.yaml / rf.yaml.
adversarial_exclude:
  - dos_slow_adv_both
  - dos_slow_adv_iat
  - dos_slow_adv_size
  - syn_dos_adv_both
  - syn_dos_adv_iat
  - syn_dos_adv_size
  - fuzzing_adv_both
  - fuzzing_adv_iat
  - fuzzing_adv_size
  - brute_force_kitsune_adv_both
  - brute_force_kitsune_adv_iat
  - brute_force_kitsune_adv_size
  - portscan_kitsune_adv_both
  - portscan_kitsune_adv_iat
  - portscan_kitsune_adv_size

# Drop matched pairs shorter than this many packets (one IPAT interval is the
# minimum signal a timing perturbation can carry).
min_len: 2

# Flow-atomic split, stratified by adversarial source. Same seed as the other
# models so the held-out test pairs never leak into any base learner's train set.
split:
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  seed: 42

# ---- Reconstructor architecture ----
# Small by design (fast, real-time denoising): causal Transformer encoder with a
# residual head, so the identity map is the easy default (Δ≈0) and capacity goes
# to the localized timing/length correction. Causal ⇒ KV-cacheable for streaming.
model:
  num_features: 1090       # 1088 nPrint bits + IPAT (z-score) + Direction
  d_model: 128
  n_layers: 3
  n_heads: 4
  dim_feedforward: 256
  dropout: 0.1
  max_seq_len: 200

# ---- Training ----
# Per-element smooth-L1 between reconstruction and the clean target, averaged
# within each flow (long flows don't dominate) and masked over padding.
training:
  device: auto             # auto | cuda | cuda:0 | cuda:1 | cpu
  epochs: 20
  batch_size: 32
  num_workers: auto        # auto | <int> — auto = min(16, cpu_count // 2)
  lr: 3.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine        # cosine | plateau
  early_stop_patience: 3
  amp: true
  max_length: 200          # truncate flows at 200 packets to bound padded batch size
  seed: 42

# ---- Traffic-space realization + protocol compliance ----
# Maps the purified length/timing back onto the original adversarial PCAP packets
# and validates them with tshark. Best-effort: if the PCAPs or tshark are absent,
# realization (and thus the protocol-compliance check) is skipped.
realize:
  adversarial_pcap_dir: data/adversarial   # original TANTGen PCAPs (phase 1 output)

# ---- Independent-NIDS efficacy (the headline purification metric) ----
# Realize adv / purified / clean packets (same flows & identity; only size+timing
# differ) and score each through the real NIDS each attack was built to evade — NOT
# DEPT's own TCN (that is circular). This is the shared `nids` registry, also used by
# the deployment baseline (scripts/baseline). Two NIDS families:
#   * Kitsune (KitNET + AfterImage) for the Kitsune-native attacks (mirai, ssdp_flood),
#     evaded by the `iat` vector. TANTGen's calibrated pickles are reused verbatim.
#   * ML-NIDS (TANTGen's CICFlowMeter flow classifiers) for the 8 CIC attacks, evaded
#     by the `size` vector. TANTGen's trained <Attack>_<MODEL>.joblib are reused.
#
# Semantics: the NIDS flags a flow when its anomaly signal is high (Kitsune RMSE > φ, or
# ML-NIDS P(malicious) > 0.5). The attack evades by suppressing it; purification recovers
# the original fingerprint, so the signal rises from the (evaded) adversarial floor
# toward the clean-original oracle. Primary per-source metric = score_restoration_ratio
# (fraction of the adv→clean gap recovered; robust to each NIDS's absolute scale). The
# cross-family overall uses detection_restoration_ratio (rate-based; see the README).
#
# Kitsune needs the sibling TANTGen repo's built AfterImage .so (+ Cython/pyximport in
# the DEPT venv); ML-NIDS needs `cicflowmeter` on PATH (pip install cicflowmeter). A
# source whose NIDS/deps are missing is skipped-with-reason so the other metric groups
# still report.
nids:
  enabled: true
  tantgen_root: ../Transformer-based_Adversarial_Network_Traffic_Generator
  default_ml_model: RF                 # ML-NIDS classifier: RF | LR | SVM | MLP
  ml_nids_model_dir: src/NIDS/models   # under tantgen_root; <Attack>_<MODEL>.joblib
  # Per-attack NIDS map (base attack -> the NIDS it was built to evade).
  attacks:
    mirai:       {kind: kitsune, model: src/Kitsune/models/Mirai_model.pkl}
    ssdp_flood:  {kind: kitsune, model: src/Kitsune/models/SSDP_Flood_model.pkl}
    ddos:        {kind: ml_nids, tg_attack: DDoS}
    portscan:    {kind: ml_nids, tg_attack: PortScan}
    brute_force: {kind: ml_nids, tg_attack: BruteForce}
    dns_ddos:    {kind: ml_nids, tg_attack: DNS_DDoS}
    ldap_ddos:   {kind: ml_nids, tg_attack: LDAP_DDoS}
    ntp_ddos:    {kind: ml_nids, tg_attack: NTP_DDoS}
    ssdp_ddos:   {kind: ml_nids, tg_attack: SSDP_DDoS}
    syn_ddos:    {kind: ml_nids, tg_attack: SYN_DDoS}
  # Kitsune-specific knobs (calibration fallback + per-flow RMSE aggregation).
  kitsune:
    model_dir: data/models/kitsune               # DEPT cache for calibrated fallbacks
    benign_pcap_dir: data/original/Kitsune/Benign # under tantgen_root; <TG>_benign.pcap
    base_to_tg: {mirai: Mirai, ssdp_flood: SSDP_Flood}
    fm_grace: 5000            # AfterImage feature-map grace (TANTGen protocol)
    ad_grace: 50000           # autoencoder-training grace
    train_cap_packets: 55000  # cap benign feature extraction (>= fm+ad)
    detection: max            # per-flow RMSE aggregation: max | mean
    seed: 42
