<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="454pt" height="121pt" viewBox="0 0 454 121" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="cd-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123a44"/>
      <stop offset="1" stop-color="#0a2229"/>
    </linearGradient>
    <radialGradient id="cd-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fd8e6" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#3fb9c9" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3fb9c9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cd-disc" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#164751"/>
      <stop offset="1" stop-color="#0e2f38"/>
    </radialGradient>
    <linearGradient id="cd-lock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ffff"/>
      <stop offset="1" stop-color="#cdeef4"/>
    </linearGradient>
    <pattern id="cd-grid" width="11" height="11" patternUnits="userSpaceOnUse">
      <rect width="1.5" height="1.5" fill="#57cede" opacity="0.10"/>
    </pattern>
  </defs>

  <!-- banner background + faint pixel/matrix texture -->
  <rect x="0" y="0" width="454" height="121" fill="url(#cd-bg)"/>
  <rect x="0" y="0" width="454" height="121" fill="url(#cd-grid)"/>
  <rect x="0.5" y="0.5" width="453" height="120" fill="none" stroke="#071a20" stroke-width="1"/>

  <!-- circuit traces (PCB motif) radiating from the central emblem -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#35b6c6" stroke-width="1.6">
      <!-- left -->
      <path d="M0,18 H48 L64,34 H172"/>
      <path d="M0,38 H30 L46,52 H120 L138,52 H176"/>
      <path d="M0,78 H70 L86,62 H172"/>
      <path d="M0,101 H54 L70,86 H150 L165,86 H175"/>
      <!-- right (mirrored) -->
      <path d="M454,18 H406 L390,34 H282"/>
      <path d="M454,38 H424 L408,52 H334 L316,52 H278"/>
      <path d="M454,78 H384 L368,62 H282"/>
      <path d="M454,101 H400 L384,86 H304 L289,86 H279"/>
    </g>
    <g stroke="#2f7fb0" stroke-width="1.4" opacity="0.85">
      <path d="M0,58 H86 L100,44 H150"/>
      <path d="M454,58 H368 L354,44 H304"/>
      <path d="M100,101 V88 H132"/>
      <path d="M354,101 V88 H322"/>
    </g>
  </g>

  <!-- solder pads / trace nodes -->
  <g fill="#6fe0ec">
    <circle cx="172" cy="34" r="2.4"/><circle cx="176" cy="52" r="2.4"/>
    <circle cx="172" cy="62" r="2.4"/><circle cx="175" cy="86" r="2.4"/>
    <circle cx="150" cy="44" r="2.2"/><circle cx="132" cy="88" r="2.2"/>
    <circle cx="282" cy="34" r="2.4"/><circle cx="278" cy="52" r="2.4"/>
    <circle cx="282" cy="62" r="2.4"/><circle cx="279" cy="86" r="2.4"/>
    <circle cx="304" cy="44" r="2.2"/><circle cx="322" cy="88" r="2.2"/>
  </g>
  <g fill="#1a4c56" stroke="#35b6c6" stroke-width="1">
    <rect x="46" y="49" width="6" height="6"/><rect x="66" y="83" width="6" height="6"/>
    <rect x="402" y="49" width="6" height="6"/><rect x="382" y="83" width="6" height="6"/>
  </g>

  <!-- central emblem: glowing ring -->
  <circle cx="227" cy="60" r="66" fill="url(#cd-glow)"/>
  <circle cx="227" cy="60" r="49" fill="none" stroke="#35c4d6" stroke-width="1" opacity="0.35"/>
  <circle cx="227" cy="60" r="44" fill="url(#cd-disc)" stroke="#45cede" stroke-width="3"/>
  <circle cx="227" cy="60" r="39" fill="none" stroke="#2a9d8f" stroke-width="1" opacity="0.5"/>
  <!-- HUD tick marks -->
  <g stroke="#35c4d6" stroke-width="1.5" opacity="0.6" stroke-linecap="round">
    <line x1="258.8" y1="28.2" x2="262.4" y2="24.6"/>
    <line x1="195.2" y1="28.2" x2="191.6" y2="24.6"/>
    <line x1="258.8" y1="91.8" x2="262.4" y2="95.4"/>
    <line x1="195.2" y1="91.8" x2="191.6" y2="95.4"/>
  </g>

  <!-- padlock -->
  <path d="M214,57 V44 A13,13 0 0 1 240,44 V57" fill="none" stroke="#dff6fa" stroke-width="5" stroke-linecap="round"/>
  <rect x="207" y="55" width="40" height="31" rx="6" fill="url(#cd-lock)" stroke="#bfeef4" stroke-width="1.2"/>
  <circle cx="227" cy="69" r="3.6" fill="#0c2a31"/>
  <path d="M224.6,71 L229.4,71 L228.1,80 L225.9,80 Z" fill="#0c2a31"/>
</svg>
