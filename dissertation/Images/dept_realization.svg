<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="rArr" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#3a444e"/>
    </marker>
    <marker id="rArrT" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#2a9d8f"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f6cdc7"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c44536" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- purified quantities -->
  <rect x="120" y="36" width="520" height="64" rx="10" fill="#dff0ed" stroke="#2a9d8f" stroke-width="2.5" stroke-dasharray="8,6"/>
  <text x="380" y="76" text-anchor="middle" font-size="22" fill="#14544c">purified quantities:  IPv4 total length,  IPAT</text>

  <!-- edit arrows -->
  <line x1="255" y1="100" x2="180" y2="182" stroke="#2a9d8f" stroke-width="2.5" marker-end="url(#rArrT)"/>
  <text x="150" y="140" text-anchor="middle" font-size="19" fill="#14544c">rewrite</text>
  <text x="150" y="162" text-anchor="middle" font-size="19" fill="#14544c">timestamp</text>
  <line x1="510" y1="100" x2="576" y2="182" stroke="#2a9d8f" stroke-width="2.5" marker-end="url(#rArrT)"/>
  <text x="632" y="140" text-anchor="middle" font-size="19" fill="#14544c">trim / pad</text>
  <text x="632" y="162" text-anchor="middle" font-size="19" fill="#14544c">payload</text>

  <!-- original adversarial packet -->
  <text x="105" y="216" text-anchor="end" font-size="20" fill="#1a1a1a">t</text>
  <g stroke-width="2.5">
    <rect x="120" y="190" width="120" height="54" fill="#d7e4f2" stroke="#2c5f8a"/>
    <rect x="240" y="190" width="120" height="54" fill="#d7e4f2" stroke="#2c5f8a"/>
    <rect x="360" y="190" width="180" height="54" fill="#f7f9fa" stroke="#5a6673"/>
    <rect x="540" y="190" width="120" height="54" fill="url(#hatch)" stroke="#c44536"/>
  </g>
  <text x="180" y="224" text-anchor="middle" font-size="19" fill="#16344c">IP header</text>
  <text x="300" y="224" text-anchor="middle" font-size="19" fill="#16344c">L4 header</text>
  <text x="450" y="224" text-anchor="middle" font-size="19" fill="#1a1a1a">payload</text>
  <text x="600" y="224" text-anchor="middle" font-size="18" fill="#7a4a44">attack pad</text>
  <text x="380" y="278" text-anchor="middle" font-size="21" fill="#1a1a1a">original adversarial packet (identity and payload kept)</text>

  <!-- rebuild -->
  <line x1="380" y1="292" x2="380" y2="336" stroke="#3a444e" stroke-width="3" marker-end="url(#rArr)"/>
  <rect x="120" y="343" width="540" height="64" rx="10" fill="#f7f9fa" stroke="#5a6673" stroke-width="2"/>
  <text x="380" y="383" text-anchor="middle" font-size="21" fill="#1a1a1a">scapy rebuild: checksums and lengths recomputed</text>

  <line x1="380" y1="407" x2="380" y2="451" stroke="#3a444e" stroke-width="3" marker-end="url(#rArr)"/>

  <!-- purified packet -->
  <text x="105" y="484" text-anchor="end" font-size="20" fill="#1a1a1a">t&#8242;</text>
  <g stroke-width="2.5">
    <rect x="120" y="458" width="120" height="54" fill="#d7e4f2" stroke="#2c5f8a"/>
    <rect x="240" y="458" width="120" height="54" fill="#d7e4f2" stroke="#2c5f8a"/>
    <rect x="360" y="458" width="180" height="54" fill="#f7f9fa" stroke="#2a9d8f"/>
  </g>
  <text x="180" y="492" text-anchor="middle" font-size="19" fill="#16344c">IP header</text>
  <text x="300" y="492" text-anchor="middle" font-size="19" fill="#16344c">L4 header</text>
  <text x="450" y="492" text-anchor="middle" font-size="19" fill="#1a1a1a">payload</text>
  <text x="380" y="546" text-anchor="middle" font-size="21" fill="#1a1a1a">realized purified packet</text>

  <line x1="380" y1="560" x2="380" y2="586" stroke="#3a444e" stroke-width="3" marker-end="url(#rArr)"/>
  <text x="380" y="622" text-anchor="middle" font-size="21" fill="#1a1a1a">tshark dissector check (protocol compliance)</text>
</svg>
