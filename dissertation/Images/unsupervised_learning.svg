  <!-- anomaly -->
  <g stroke="#b0453a" stroke-width="5">
    <line x1="866" y1="176" x2="892" y2="202"/>
    <line x1="892" y1="176" x2="866" y2="202"/>
  </g>
  <text x="857" y="236" text-anchor="middle" font-size="20" fill="#7c2c23">flagged as</text>
