    <rect x="83"  y="330" width="36" height="36" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <rect x="126" y="330" width="36" height="36" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <rect x="169" y="330" width="36" height="36" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <rect x="212" y="330" width="36" height="36" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
  </g>
  <text x="144" y="404" text-anchor="middle" font-size="20" font-style="italic" fill="#5a6673">no labels available</text>

  <!-- arrow to model -->
  <line x1="268" y1="245" x2="312" y2="245" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>

  <!-- model -->
  <rect x="320" y="175" width="260" height="140" rx="14" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="3"/>
  <text x="450" y="235" text-anchor="middle" font-size="28" fill="#16344c">unsupervised model</text>
  <text x="450" y="277" text-anchor="middle" font-size="22" font-style="italic" fill="#2c5f8a">learns traffic structure</text>

  <!-- arrow to panel -->
  <line x1="580" y1="245" x2="624" y2="245" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>

  <!-- learned-structure panel -->
  <rect x="632" y="100" width="298" height="400" rx="14" fill="#fbfcfd" stroke="#5a6673" stroke-width="2.5"/>
  <text x="781" y="140" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a1a">learned structure</text>

