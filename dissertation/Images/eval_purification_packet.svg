<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pArrR" markerWidth="10" markerHeight="10" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#c44536"/>
    </marker>
    <marker id="pArrT" markerWidth="10" markerHeight="10" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#2a9d8f"/>
    </marker>
    <pattern id="ppad" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f6cdc7"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c44536" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- header: real flow identity -->
  <text x="410" y="30" text-anchor="middle" font-size="18" fill="#1a1a1a">
    Mirai SYN-flood micro-flow &#8226; 192.168.2.108:35220 &#8594; 52.25.66.250:8280 &#8226; 4 packets (size variant)</text>

  <!-- ===================== ORIGINAL (before TANTGen) ===================== -->
  <text x="205" y="86" text-anchor="end" font-size="17" fill="#1a1a1a">Original</text>
  <text x="205" y="106" text-anchor="end" font-size="14" fill="#5a6673">before TANTGen</text>
  <g stroke-width="2.5">
    <rect x="220" y="72" width="128" height="46" fill="#d7e4f2" stroke="#2c5f8a"/>
    <rect x="348" y="72" width="154" height="46" fill="#eef1f4" stroke="#5a6673"/>
  </g>
  <text x="284" y="100" text-anchor="middle" font-size="15" fill="#16344c">IP  20 B</text>
  <text x="425" y="100" text-anchor="middle" font-size="15" fill="#3a444e">TCP  24 B</text>
  <text x="516" y="100" text-anchor="start" font-size="16" fill="#1a1a1a">= 44 B</text>

  <!-- transition 1: attack -->
  <line x1="150" y1="122" x2="150" y2="172" stroke="#c44536" stroke-width="2.5" marker-end="url(#pArrR)"/>
  <text x="176" y="142" text-anchor="start" font-size="15" fill="#7a2f26">TANTGen size attack &#8212; append 29 payload bytes</text>
  <text x="176" y="163" text-anchor="start" font-size="15" fill="#7a2f26">IPv4 total length inflated 44 B &#8594; 73 B (evasion)</text>

  <!-- ===================== ADVERSARIAL (after TANTGen) ===================== -->
  <text x="205" y="204" text-anchor="end" font-size="17" fill="#1a1a1a">Adversarial</text>
  <text x="205" y="224" text-anchor="end" font-size="14" fill="#5a6673">after TANTGen</text>
  <g stroke-width="2.5">
    <rect x="220" y="190" width="128" height="46" fill="#d7e4f2" stroke="#2c5f8a"/>
    <rect x="348" y="190" width="154" height="46" fill="#eef1f4" stroke="#5a6673"/>
    <rect x="502" y="190" width="186" height="46" fill="url(#ppad)" stroke="#c44536"/>
  </g>
  <text x="284" y="218" text-anchor="middle" font-size="15" fill="#16344c">IP  20 B</text>
  <text x="425" y="218" text-anchor="middle" font-size="15" fill="#3a444e">TCP  24 B</text>
  <rect x="558" y="204" width="74" height="24" rx="4" fill="#fbeae8" stroke="#c44536" stroke-width="1"/>
  <text x="595" y="221" text-anchor="middle" font-size="15" fill="#7a2f26">+29 B pad</text>
  <text x="702" y="218" text-anchor="start" font-size="16" fill="#7a2f26">= 73 B</text>

  <!-- real appended bytes -->
  <text x="220" y="258" text-anchor="start" font-size="12.5" fill="#5a6673">appended bytes (packet 1):</text>
  <text x="392" y="258" text-anchor="start" font-size="12.5" font-family="Courier, monospace" fill="#7a2f26">36 20 47 54 ed 33 aa 02 &#8230; f1 91 03 f0 62</text>

  <!-- transition 2: purification -->
  <line x1="150" y1="272" x2="150" y2="322" stroke="#2a9d8f" stroke-width="2.5" marker-end="url(#pArrT)"/>
  <text x="176" y="292" text-anchor="start" font-size="15" fill="#14544c">DEPT purifier &#8212; reconstruct length, trim padding</text>
  <text x="176" y="313" text-anchor="start" font-size="15" fill="#14544c">IPv4 total length restored 73 B &#8594; 44 B (residual 0 B)</text>

  <!-- ===================== PURIFIED (after DEPT) ===================== -->
  <text x="205" y="354" text-anchor="end" font-size="17" fill="#1a1a1a">Purified</text>
  <text x="205" y="374" text-anchor="end" font-size="14" fill="#5a6673">after DEPT</text>
  <g stroke-width="2.5">
    <rect x="220" y="340" width="128" height="46" fill="#d7e4f2" stroke="#2a9d8f"/>
    <rect x="348" y="340" width="154" height="46" fill="#dff0ed" stroke="#2a9d8f"/>
  </g>
  <text x="284" y="368" text-anchor="middle" font-size="15" fill="#16344c">IP  20 B</text>
  <text x="425" y="368" text-anchor="middle" font-size="15" fill="#14544c">TCP  24 B</text>
  <text x="516" y="368" text-anchor="start" font-size="16" fill="#14544c">= 44 B</text>
  <text x="592" y="368" text-anchor="start" font-size="14" fill="#14544c">&#8801; original size</text>

  <!-- footer note -->
  <line x1="40" y1="410" x2="780" y2="410" stroke="#d5d9de" stroke-width="1"/>
  <text x="410" y="432" text-anchor="middle" font-size="13.5" fill="#5a6673">
    All twelve packets pass tshark dissection (0 malformed, 0 bad checksums); the size variant leaves inter-arrival times unchanged.</text>
</svg>
