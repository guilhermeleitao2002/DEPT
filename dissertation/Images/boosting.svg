<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 850" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#3a444e"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#a2721f"/>
    </marker>
  </defs>

  <!-- dataset cylinder -->
  <g>
    <rect x="210" y="58" width="220" height="80" fill="#eef1f4" stroke="none"/>
    <line x1="210" y1="58" x2="210" y2="138" stroke="#5a6673" stroke-width="2.5"/>
    <line x1="430" y1="58" x2="430" y2="138" stroke="#5a6673" stroke-width="2.5"/>
    <ellipse cx="320" cy="138" rx="110" ry="18" fill="#eef1f4" stroke="#5a6673" stroke-width="2.5"/>
    <ellipse cx="320" cy="58" rx="110" ry="18" fill="#f7f9fa" stroke="#5a6673" stroke-width="2.5"/>
    <text x="320" y="112" text-anchor="middle" font-size="26" fill="#1a1a1a">training data</text>
  </g>

  <!-- dataset -> model 1 -->
  <line x1="268" y1="152" x2="165" y2="212" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>

  <!-- model 1 -->
  <rect x="60" y="220" width="180" height="92" rx="12" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2.5"/>
  <text x="150" y="258" text-anchor="middle" font-size="24" fill="#16344c">model 1</text>
  <text x="150" y="288" text-anchor="middle" font-size="19" font-style="italic" fill="#2c5f8a">weak learner</text>

  <!-- model1 -> reweight 1 -->
  <path d="M 244 290 C 300 315 330 330 352 348" fill="none" stroke="#a2721f" stroke-width="3" marker-end="url(#arrA)"/>

  <!-- reweight 1 -->
  <rect x="300" y="352" width="260" height="68" rx="10" fill="#f6e8cd" stroke="#a2721f" stroke-width="2.5"/>
  <text x="430" y="380" text-anchor="middle" font-size="20" fill="#5e430f">reweight examples:</text>
  <text x="430" y="406" text-anchor="middle" font-size="20" fill="#5e430f">focus on the errors</text>

  <!-- reweight 1 -> model 2 -->
  <path d="M 330 424 C 280 445 235 460 200 478" fill="none" stroke="#a2721f" stroke-width="3" marker-end="url(#arrA)"/>

  <!-- model 2 -->
  <rect x="60" y="484" width="180" height="92" rx="12" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2.5"/>
  <text x="150" y="522" text-anchor="middle" font-size="24" fill="#16344c">model 2</text>
  <text x="150" y="552" text-anchor="middle" font-size="19" font-style="italic" fill="#2c5f8a">weak learner</text>

  <!-- model2 -> reweight 2 -->
  <path d="M 244 554 C 300 579 330 594 352 612" fill="none" stroke="#a2721f" stroke-width="3" marker-end="url(#arrA)"/>

  <!-- reweight 2 -->
  <rect x="300" y="616" width="260" height="68" rx="10" fill="#f6e8cd" stroke="#a2721f" stroke-width="2.5"/>
  <text x="430" y="644" text-anchor="middle" font-size="20" fill="#5e430f">reweight examples:</text>
  <text x="430" y="670" text-anchor="middle" font-size="20" fill="#5e430f">focus on the errors</text>

  <!-- reweight 2 -> model 3 -->
  <path d="M 330 688 C 285 700 245 704 212 712" fill="none" stroke="#a2721f" stroke-width="3" marker-end="url(#arrA)"/>

  <!-- model 3 -->
  <rect x="60" y="716" width="180" height="92" rx="12" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2.5"/>
  <text x="150" y="754" text-anchor="middle" font-size="24" fill="#16344c">model 3</text>
  <text x="150" y="784" text-anchor="middle" font-size="19" font-style="italic" fill="#2c5f8a">weak learner</text>

  <!-- weighted sum of all models -->
  <path d="M 240 762 C 330 762 390 762 442 762" fill="none" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="450" y="726" width="170" height="72" rx="12" fill="#eef1f4" stroke="#5a6673" stroke-width="2.5"/>
  <text x="535" y="756" text-anchor="middle" font-size="21" fill="#1a1a1a">weighted sum</text>
  <text x="535" y="784" text-anchor="middle" font-size="21" fill="#1a1a1a">= prediction</text>

  <!-- sequential note -->
  <text x="430" y="180" text-anchor="middle" font-size="19" font-style="italic" fill="#5a6673">sequential: each model</text>
  <text x="430" y="205" text-anchor="middle" font-size="19" font-style="italic" fill="#5a6673">corrects its predecessor</text>
</svg>
