<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#3a444e"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#c44536"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#2a9d8f"/>
    </marker>
  </defs>

  <!-- benign traffic source -->
  <g>
    <ellipse cx="140" cy="120" rx="95" ry="46" fill="#eef1f4" stroke="#5a6673" stroke-width="2.5"/>
    <circle cx="108" cy="128" r="12" fill="none" stroke="#5a6673" stroke-width="2.5"/>
    <circle cx="140" cy="128" r="12" fill="none" stroke="#5a6673" stroke-width="2.5"/>
    <circle cx="172" cy="128" r="12" fill="none" stroke="#5a6673" stroke-width="2.5"/>
    <text x="140" y="196" text-anchor="middle" font-size="26" fill="#1a1a1a">benign traffic</text>
  </g>

  <!-- adversarial traffic source -->
  <g>
    <rect x="55" y="270" width="170" height="88" rx="10" fill="#fbeae8" stroke="#c44536" stroke-width="2.5"/>
    <circle cx="140" cy="301" r="16" fill="none" stroke="#c44536" stroke-width="2.5"/>
    <path d="M112,348 Q140,318 168,348" fill="none" stroke="#c44536" stroke-width="2.5"/>
    <text x="140" y="390" text-anchor="middle" font-size="26" fill="#1a1a1a">adversarial traffic</text>
    <text x="140" y="418" text-anchor="middle" font-size="23" fill="#7a4a44">(TANTGen)</text>
  </g>

  <!-- arrows into DEPT -->
  <line x1="245" y1="135" x2="395" y2="185" stroke="#3a444e" stroke-width="4" marker-end="url(#arrD)"/>
  <line x1="232" y1="300" x2="395" y2="245" stroke="#c44536" stroke-width="4" marker-end="url(#arrR)"/>

  <!-- DEPT box -->
  <rect x="410" y="90" width="520" height="260" rx="16" fill="#ffffff" stroke="#2c5f8a" stroke-width="3.5"/>
  <text x="670" y="130" text-anchor="middle" font-size="30" font-weight="bold" letter-spacing="2" fill="#2c5f8a">DEPT</text>

  <!-- internal stages -->
  <rect x="435" y="160" width="200" height="100" rx="10" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2.5"/>
  <text x="535" y="202" text-anchor="middle" font-size="24" fill="#16344c">detection</text>
  <text x="535" y="230" text-anchor="middle" font-size="24" fill="#16344c">ensemble</text>

  <rect x="710" y="160" width="200" height="100" rx="10" fill="#dff0ed" stroke="#2a9d8f" stroke-width="2.5"/>
  <text x="810" y="202" text-anchor="middle" font-size="24" fill="#14544c">purifier</text>
  <text x="810" y="230" text-anchor="middle" font-size="24" fill="#14544c">(reconstructor)</text>

  <line x1="635" y1="210" x2="702" y2="210" stroke="#c44536" stroke-width="3" marker-end="url(#arrR)"/>
  <text x="671" y="243" text-anchor="middle" font-size="18" fill="#7a4a44">flagged</text>

  <!-- clean bypass -->
  <path d="M535,260 V305 H905" fill="none" stroke="#3a444e" stroke-width="3"/>
  <text x="720" y="332" text-anchor="middle" font-size="21" fill="#3a444e">clean flows are forwarded unchanged</text>

  <!-- purified/forwarded output -->
  <path d="M910,210 H1005 V228" fill="none" stroke="#2a9d8f" stroke-width="4"/>
  <path d="M905,305 H1005 V282" fill="none" stroke="#3a444e" stroke-width="3"/>
  <line x1="1005" y1="255" x2="1075" y2="255" stroke="#2a9d8f" stroke-width="4" marker-end="url(#arrT)"/>
  <text x="1010" y="204" text-anchor="middle" font-size="22" fill="#14544c">purified flow</text>

  <!-- protected NIDS -->
  <rect x="1090" y="175" width="200" height="160" rx="12" fill="#f3f9f7" stroke="#2a9d8f" stroke-width="3"/>
  <path d="M1252,196 l14,5 v12 q0,14 -14,19 q-14,-5 -14,-19 v-12 Z" fill="#2a9d8f"/>
  <text x="1190" y="250" text-anchor="middle" font-size="25" font-weight="bold" fill="#1a1a1a">protected</text>
  <text x="1190" y="280" text-anchor="middle" font-size="25" font-weight="bold" fill="#1a1a1a">NIDS</text>

  <!-- arrow to network -->
  <line x1="1290" y1="255" x2="1345" y2="255" stroke="#5a6673" stroke-width="3.5" marker-end="url(#arrD)"/>

  <!-- network -->
  <g>
    <rect x="1360" y="205" width="38" height="80" fill="#eef1f4" stroke="#5a6673" stroke-width="2.5"/>
    <rect x="1404" y="182" width="46" height="103" fill="#eef1f4" stroke="#5a6673" stroke-width="2.5"/>
    <rect x="1369" y="220" width="9" height="9" fill="#5a6673"/>
    <rect x="1384" y="220" width="9" height="9" fill="#5a6673"/>
    <rect x="1369" y="240" width="9" height="9" fill="#5a6673"/>
    <rect x="1384" y="240" width="9" height="9" fill="#5a6673"/>
    <rect x="1414" y="198" width="9" height="9" fill="#5a6673"/>
    <rect x="1430" y="198" width="9" height="9" fill="#5a6673"/>
    <rect x="1414" y="218" width="9" height="9" fill="#5a6673"/>
    <rect x="1430" y="218" width="9" height="9" fill="#5a6673"/>
    <text x="1405" y="322" text-anchor="middle" font-size="24" fill="#1a1a1a">protected</text>
    <text x="1405" y="350" text-anchor="middle" font-size="24" fill="#1a1a1a">network</text>
  </g>
</svg>
