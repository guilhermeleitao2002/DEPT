<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#3a444e"/>
    </marker>
  </defs>

  <!-- dataset cylinder -->
  <g>
    <rect x="210" y="58" width="220" height="80" fill="#eef1f4" stroke="none"/>
    <line x1="210" y1="58" x2="210" y2="138" stroke="#5a6673" stroke-width="2.5"/>
    <line x1="430" y1="58" x2="430" y2="138" stroke="#5a6673" stroke-width="2.5"/>
    <ellipse cx="320" cy="138" rx="110" ry="18" fill="#eef1f4" stroke="#5a6673" stroke-width="2.5"/>
    <ellipse cx="320" cy="58" rx="110" ry="18" fill="#f7f9fa" stroke="#5a6673" stroke-width="2.5"/>
    <text x="320" y="112" text-anchor="middle" font-size="26" fill="#1a1a1a">training data</text>
  </g>

  <!-- arrows to heterogeneous models -->
  <line x1="252" y1="150" x2="125" y2="242" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="320" y1="160" x2="320" y2="242" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="388" y1="150" x2="515" y2="242" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>

  <!-- base model 1: decision tree -->
  <g>
    <rect x="40" y="250" width="160" height="130" rx="10" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2.5"/>
    <g stroke="#2c5f8a" stroke-width="2">
      <line x1="120" y1="282" x2="96"  y2="310"/>
      <line x1="120" y1="282" x2="144" y2="310"/>
      <line x1="96"  y1="310" x2="82"  y2="336"/>
      <line x1="96"  y1="310" x2="110" y2="336"/>
      <line x1="144" y1="310" x2="130" y2="336"/>
      <line x1="144" y1="310" x2="158" y2="336"/>
    </g>
    <g fill="#f7f9fa" stroke="#2c5f8a" stroke-width="2">
      <circle cx="120" cy="282" r="8"/>
      <circle cx="96"  cy="310" r="8"/>
      <circle cx="144" cy="310" r="8"/>
      <circle cx="82"  cy="336" r="8"/>
      <circle cx="110" cy="336" r="8"/>
      <circle cx="130" cy="336" r="8"/>
      <circle cx="158" cy="336" r="8"/>
    </g>
    <text x="120" y="368" text-anchor="middle" font-size="20" fill="#16344c">tree ensemble</text>
  </g>

  <!-- base model 2: neural network -->
  <g>
    <rect x="240" y="250" width="160" height="130" rx="10" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2.5"/>
    <g stroke="#2c5f8a" stroke-width="1.6">
      <line x1="285" y1="285" x2="320" y2="276"/>
      <line x1="285" y1="285" x2="320" y2="300"/>
      <line x1="285" y1="285" x2="320" y2="324"/>
      <line x1="285" y1="315" x2="320" y2="276"/>
      <line x1="285" y1="315" x2="320" y2="300"/>
      <line x1="285" y1="315" x2="320" y2="324"/>
      <line x1="285" y1="345" x2="320" y2="300"/>
      <line x1="285" y1="345" x2="320" y2="324"/>
      <line x1="285" y1="345" x2="320" y2="348"/>
      <line x1="320" y1="276" x2="355" y2="298"/>
      <line x1="320" y1="300" x2="355" y2="298"/>
      <line x1="320" y1="324" x2="355" y2="298"/>
      <line x1="320" y1="300" x2="355" y2="330"/>
      <line x1="320" y1="324" x2="355" y2="330"/>
      <line x1="320" y1="348" x2="355" y2="330"/>
    </g>
    <g fill="#f7f9fa" stroke="#2c5f8a" stroke-width="2">
      <circle cx="285" cy="285" r="8"/>
      <circle cx="285" cy="315" r="8"/>
      <circle cx="285" cy="345" r="8"/>
      <circle cx="320" cy="276" r="8"/>
      <circle cx="320" cy="300" r="8"/>
      <circle cx="320" cy="324" r="8"/>
      <circle cx="320" cy="348" r="8"/>
      <circle cx="355" cy="298" r="8"/>
      <circle cx="355" cy="330" r="8"/>
    </g>
    <text x="320" y="368" text-anchor="middle" font-size="20" fill="#16344c">neural network</text>
  </g>

  <!-- base model 3: other learner -->
  <g>
    <rect x="440" y="250" width="160" height="130" rx="10" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2.5"/>
    <g stroke="#2c5f8a" stroke-width="2" fill="none">
      <line x1="470" y1="350" x2="470" y2="270"/>
      <line x1="470" y1="350" x2="575" y2="350"/>
      <path d="M 478 344 C 505 342 530 300 566 280"/>
    </g>
    <circle cx="500" cy="330" r="5" fill="#2c5f8a"/>
    <circle cx="522" cy="312" r="5" fill="#2c5f8a"/>
    <circle cx="548" cy="292" r="5" fill="#2c5f8a"/>
    <text x="520" y="368" text-anchor="middle" font-size="20" fill="#16344c">other learner</text>
  </g>
  <text x="320" y="416" text-anchor="middle" font-size="19" font-style="italic" fill="#5a6673">heterogeneous base models</text>

  <!-- arrows: base predictions to meta-learner -->
  <line x1="120" y1="385" x2="245" y2="502" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="320" y1="432" x2="320" y2="498" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="520" y1="385" x2="395" y2="502" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>
  <text x="468" y="478" font-size="19" font-style="italic" fill="#5a6673">base predictions</text>

  <!-- meta-learner -->
  <rect x="150" y="506" width="340" height="120" rx="14" fill="#f6e8cd" stroke="#a2721f" stroke-width="3"/>
  <text x="320" y="552" text-anchor="middle" font-size="27" fill="#5e430f">meta-learner</text>
  <text x="320" y="586" text-anchor="middle" font-size="20" font-style="italic" fill="#5e430f">learns how to combine them</text>

  <!-- prediction -->
  <line x1="320" y1="626" x2="320" y2="672" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="230" y="678" width="180" height="56" rx="12" fill="#eef1f4" stroke="#5a6673" stroke-width="2.5"/>
  <text x="320" y="714" text-anchor="middle" font-size="24" fill="#1a1a1a">prediction</text>
</svg>
