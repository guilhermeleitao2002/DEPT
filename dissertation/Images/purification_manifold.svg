<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#3a444e"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#b0453a"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#a2721f"/>
    </marker>
  </defs>

  <!-- feature-space frame hint -->
  <text x="60" y="60" font-size="22" font-style="italic" fill="#8a939c">feature space</text>

  <!-- benign manifold -->
  <path d="M 120,430 C 160,250 400,150 610,190 C 760,218 830,330 780,440
           C 720,560 430,610 260,555 C 165,524 95,540 120,430 Z"
        fill="#d9ebe4" fill-opacity="0.85" stroke="#257a68" stroke-width="3"/>
  <text x="330" y="500" font-size="26" fill="#14483d">manifold of</text>
  <text x="330" y="532" font-size="26" fill="#14483d">benign traffic</text>

  <!-- clean flow x -->
  <circle cx="500" cy="330" r="12" fill="#1d5b4e"/>
  <text x="500" y="296" text-anchor="middle" font-size="24" fill="#14483d">clean flow x</text>

  <!-- adversarial flow x' -->
  <circle cx="930" cy="170" r="12" fill="#b0453a"/>
  <text x="938" y="136" text-anchor="middle" font-size="24" fill="#7c2c23">adversarial flow x&#8242;</text>

  <!-- perturbation arrow -->
  <line x1="514" y1="325" x2="912" y2="176" stroke="#b0453a" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrR)"/>
  <text x="680" y="228" text-anchor="middle" font-size="22" fill="#b0453a">perturbation &#948;</text>

  <!-- purified point -->
  <circle cx="628" cy="368" r="12" fill="#f6e8cd" stroke="#a2721f" stroke-width="5"/>
  <text x="600" y="422" text-anchor="middle" font-size="24" fill="#5e430f">purified g(x&#8242;) &#8776; x</text>

  <!-- purification arrow -->
  <path d="M 928 186 C 895 320 780 372 652 366" fill="none" stroke="#a2721f" stroke-width="4" marker-end="url(#arrA)"/>
  <text x="740" y="300" text-anchor="middle" font-size="22" fill="#a2721f">purifier projects x&#8242;</text>
  <text x="740" y="328" text-anchor="middle" font-size="22" fill="#a2721f">back onto the manifold</text>

  <!-- evasion path (without purification) -->
  <line x1="946" y1="180" x2="1090" y2="452" stroke="#b0453a" stroke-width="2.5" stroke-dasharray="5 7" marker-end="url(#arrR)"/>
  <text x="1160" y="330" text-anchor="middle" font-size="20" font-style="italic" fill="#b0453a">without purification:</text>
  <text x="1160" y="356" text-anchor="middle" font-size="20" font-style="italic" fill="#b0453a">misclassified</text>

  <!-- path purified -> detector -->
  <path d="M 645 380 C 780 460 880 490 1000 502" fill="none" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>

  <!-- detector box -->
  <rect x="1010" y="470" width="230" height="96" rx="14" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="3"/>
  <text x="1125" y="510" text-anchor="middle" font-size="25" fill="#16344c">downstream</text>
  <text x="1125" y="542" text-anchor="middle" font-size="25" fill="#16344c">detector</text>

  <!-- verdict chip -->
  <line x1="1125" y1="566" x2="1125" y2="596" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="1045" y="602" width="160" height="48" rx="10" fill="#d9ebe4" stroke="#257a68" stroke-width="2.5"/>
  <text x="1125" y="634" text-anchor="middle" font-size="24" fill="#14483d">benign</text>
</svg>
