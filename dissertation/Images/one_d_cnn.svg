<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1780 330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#3a444e"/>
    </marker>
  </defs>

  <!-- ============ input packet sequence ============ -->
  <text x="255" y="52" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a1a1a">input packet sequence</text>
  <text x="176" y="112" text-anchor="middle" font-size="21" fill="#a2721f">kernel (k = 3) slides &#8594;</text>

  <!-- tokens -->
  <g>
    <rect x="40"  y="150" width="48" height="48" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <rect x="96"  y="150" width="48" height="48" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <rect x="152" y="150" width="48" height="48" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <rect x="208" y="150" width="48" height="48" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <rect x="264" y="150" width="48" height="48" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <rect x="320" y="150" width="48" height="48" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <rect x="376" y="150" width="48" height="48" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <rect x="432" y="150" width="48" height="48" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
  </g>
  <!-- token indices -->
  <g font-size="21" fill="#5a6673" text-anchor="middle">
    <text x="64"  y="228">p1</text>
    <text x="120" y="228">p2</text>
    <text x="176" y="228">p3</text>
    <text x="232" y="228">p4</text>
    <text x="288" y="228">p5</text>
    <text x="344" y="228">p6</text>
    <text x="400" y="228">p7</text>
    <text x="456" y="228">p8</text>
  </g>
  <text x="262" y="268" text-anchor="middle" font-size="20" font-style="italic" fill="#5a6673">one token per packet (header bits + IPAT + direction)</text>

  <!-- kernel window over p2-p4 -->
  <rect x="90" y="142" width="172" height="64" rx="10" fill="none" stroke="#a2721f" stroke-width="4"/>

  <!-- arrow -->
  <line x1="496" y1="174" x2="548" y2="174" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>

  <!-- feature maps (stacked strips) -->
  <rect x="576" y="126" width="294" height="44" rx="4" fill="none" stroke="#b9c2cc" stroke-width="2"/>
  <rect x="568" y="134" width="294" height="44" rx="4" fill="none" stroke="#8a939c" stroke-width="2"/>
  <g>
    <rect x="560" y="142" width="44" height="44" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2"/>
    <rect x="610" y="142" width="44" height="44" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2"/>
    <rect x="660" y="142" width="44" height="44" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2"/>
    <rect x="710" y="142" width="44" height="44" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2"/>
    <rect x="760" y="142" width="44" height="44" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2"/>
    <rect x="810" y="142" width="44" height="44" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2"/>
  </g>
  <text x="707" y="228" text-anchor="middle" font-size="21" fill="#5a6673">feature maps</text>
  <text x="707" y="254" text-anchor="middle" font-size="20" font-style="italic" fill="#5a6673">(one value per position, one map per kernel)</text>

  <!-- arrow -->
  <line x1="886" y1="174" x2="938" y2="174" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>

  <!-- stacked conv layers -->
  <rect x="946" y="128" width="212" height="94" rx="12" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="3"/>
  <text x="1052" y="168" text-anchor="middle" font-size="24" fill="#16344c">further conv.</text>
  <text x="1052" y="200" text-anchor="middle" font-size="24" fill="#16344c">layers (&#215;L)</text>

  <!-- arrow -->
  <line x1="1166" y1="174" x2="1218" y2="174" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>

  <!-- pooling -->
  <rect x="1226" y="128" width="166" height="94" rx="12" fill="#eef1f4" stroke="#5a6673" stroke-width="2.5"/>
  <text x="1309" y="168" text-anchor="middle" font-size="24" fill="#1a1a1a">pooling /</text>
  <text x="1309" y="200" text-anchor="middle" font-size="24" fill="#1a1a1a">aggregation</text>

  <!-- arrow -->
  <line x1="1400" y1="174" x2="1452" y2="174" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>

  <!-- head -->
  <rect x="1460" y="128" width="180" height="94" rx="12" fill="#f6e8cd" stroke="#a2721f" stroke-width="3"/>
  <text x="1550" y="168" text-anchor="middle" font-size="24" fill="#5e430f">classification</text>
  <text x="1550" y="200" text-anchor="middle" font-size="24" fill="#5e430f">head</text>

  <!-- arrow + verdict -->
  <line x1="1648" y1="174" x2="1692" y2="174" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>
  <text x="1735" y="163" text-anchor="middle" font-size="22" fill="#1a1a1a">benign /</text>
  <text x="1735" y="192" text-anchor="middle" font-size="22" fill="#1a1a1a">malicious</text>
</svg>
