<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#3a444e"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#c44536"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#2c5f8a"/>
    </marker>
  </defs>

  <!-- attacker -->
  <g>
    <rect x="45" y="200" width="180" height="100" rx="10" fill="#fbeae8" stroke="#c44536" stroke-width="2.5"/>
    <circle cx="135" cy="233" r="15" fill="none" stroke="#c44536" stroke-width="2.5"/>
    <path d="M105,288 Q135,254 165,288" fill="none" stroke="#c44536" stroke-width="2.5"/>
    <text x="135" y="330" text-anchor="middle" font-size="26" fill="#1a1a1a">attacker</text>
  </g>

  <!-- split towards the two paths -->
  <path d="M225,230 L262,230 L262,140 L318,140" fill="none" stroke="#c44536" stroke-width="3" marker-end="url(#arrR)"/>
  <path d="M225,270 L262,270 L262,420 L283,420" fill="none" stroke="#c44536" stroke-width="3" marker-end="url(#arrR)"/>

  <!-- top path: attack as generated -->
  <text x="470" y="92" text-anchor="middle" font-size="23" fill="#1a1a1a">attack traffic, as generated</text>
  <g fill="#fbeae8" stroke="#c44536" stroke-width="2.5">
    <rect x="340" y="122" width="34" height="36"/>
    <rect x="412" y="122" width="34" height="36"/>
    <rect x="484" y="122" width="34" height="36"/>
    <rect x="556" y="122" width="34" height="36"/>
  </g>
  <line x1="612" y1="140" x2="896" y2="140" stroke="#c44536" stroke-width="3.5" marker-end="url(#arrR)"/>

  <!-- generator box on the bottom path -->
  <g>
    <rect x="295" y="355" width="250" height="130" rx="10" fill="#fbeae8" stroke="#c44536" stroke-width="3"/>
    <text x="420" y="398" text-anchor="middle" font-size="26" font-weight="bold" fill="#c44536">TANTGen</text>
    <text x="420" y="430" text-anchor="middle" font-size="20" fill="#7a4a44">black-box adversarial</text>
    <text x="420" y="456" text-anchor="middle" font-size="20" fill="#7a4a44">reshaping (timing, size)</text>
  </g>

  <!-- bottom path: reshaped packets (padded sizes, uneven gaps) -->
  <text x="730" y="336" text-anchor="middle" font-size="23" fill="#1a1a1a">the same attack, reshaped</text>
  <g fill="#fbeae8" stroke="#c44536" stroke-width="2.5">
    <rect x="600" y="402" width="56" height="36"/>
    <rect x="674" y="402" width="30" height="36"/>
    <rect x="748" y="402" width="64" height="36"/>
    <rect x="826" y="402" width="34" height="36"/>
  </g>
  <text x="730" y="472" text-anchor="middle" font-size="19" fill="#7a4a44">every packet still protocol-compliant</text>
  <line x1="545" y1="420" x2="592" y2="420" stroke="#c44536" stroke-width="3" marker-end="url(#arrR)"/>
  <line x1="868" y1="420" x2="896" y2="420" stroke="#c44536" stroke-width="3.5" marker-end="url(#arrR)"/>

  <!-- ML-based NIDS -->
  <g>
    <rect x="910" y="100" width="220" height="380" rx="12" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="3.5"/>
    <circle cx="1014" cy="196" r="26" fill="#ffffff" stroke="#2c5f8a" stroke-width="3"/>
    <line x1="1033" y1="215" x2="1054" y2="236" stroke="#2c5f8a" stroke-width="4"/>
    <text x="1020" y="292" text-anchor="middle" font-size="27" font-weight="bold" fill="#16344c">ML-based</text>
    <text x="1020" y="324" text-anchor="middle" font-size="27" font-weight="bold" fill="#16344c">NIDS</text>
  </g>

  <!-- top outcome: detected -->
  <line x1="1130" y1="140" x2="1210" y2="140" stroke="#2c5f8a" stroke-width="3.5" marker-end="url(#arrB)"/>
  <circle cx="1250" cy="140" r="17" fill="none" stroke="#2c5f8a" stroke-width="3"/>
  <line x1="1238" y1="152" x2="1262" y2="128" stroke="#2c5f8a" stroke-width="3"/>
  <text x="1284" y="133" font-size="23" fill="#1a1a1a">flagged as malicious</text>
  <text x="1284" y="161" font-size="20" fill="#3a444e">(attack blocked)</text>

  <!-- bottom outcome: labelled benign, delivered -->
  <line x1="1130" y1="420" x2="1342" y2="420" stroke="#c44536" stroke-width="3.5" marker-end="url(#arrR)"/>
  <text x="1236" y="398" text-anchor="middle" font-size="23" fill="#1a1a1a">labelled benign</text>
  <text x="1236" y="452" text-anchor="middle" font-size="20" fill="#7a4a44">(forwarded)</text>

  <!-- protected network -->
  <g>
    <rect x="1358" y="378" width="38" height="80" fill="#eef1f4" stroke="#5a6673" stroke-width="2.5"/>
    <rect x="1402" y="355" width="46" height="103" fill="#eef1f4" stroke="#5a6673" stroke-width="2.5"/>
    <rect x="1367" y="393" width="9" height="9" fill="#5a6673"/>
    <rect x="1382" y="393" width="9" height="9" fill="#5a6673"/>
    <rect x="1367" y="413" width="9" height="9" fill="#5a6673"/>
    <rect x="1382" y="413" width="9" height="9" fill="#5a6673"/>
    <rect x="1412" y="371" width="9" height="9" fill="#5a6673"/>
    <rect x="1428" y="371" width="9" height="9" fill="#5a6673"/>
    <rect x="1412" y="391" width="9" height="9" fill="#5a6673"/>
    <rect x="1428" y="391" width="9" height="9" fill="#5a6673"/>
    <path d="M1449,318 L1469,352 L1429,352 Z" fill="#fbeae8" stroke="#c44536" stroke-width="2.5"/>
    <text x="1449" y="348" text-anchor="middle" font-size="22" font-weight="bold" fill="#c44536">!</text>
    <text x="1403" y="496" text-anchor="middle" font-size="22" fill="#1a1a1a">protected</text>
    <text x="1403" y="522" text-anchor="middle" font-size="22" fill="#1a1a1a">network</text>
  </g>
</svg>
