<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="pArr" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#3a444e"/>
    </marker>
  </defs>

  <!-- input token row -->
  <text x="330" y="48" text-anchor="middle" font-size="23" fill="#1a1a1a">adversarial flow  x</text>
  <g stroke-width="2">
    <rect x="180" y="66" width="44" height="44" fill="#f7f9fa" stroke="#5a6673"/>
    <rect x="230" y="66" width="44" height="44" fill="#f7f9fa" stroke="#5a6673"/>
    <rect x="280" y="66" width="44" height="44" fill="#f6cdc7" stroke="#c44536"/>
    <rect x="330" y="66" width="44" height="44" fill="#f7f9fa" stroke="#5a6673"/>
    <rect x="380" y="66" width="44" height="44" fill="#f6cdc7" stroke="#c44536"/>
    <rect x="430" y="66" width="44" height="44" fill="#f7f9fa" stroke="#5a6673"/>
  </g>
  <text x="240" y="139" text-anchor="middle" font-size="18" fill="#7a4a44">perturbed dims</text>

  <!-- skip connection -->
  <path d="M480,88 H660 V500 H415" fill="none" stroke="#8a949e" stroke-width="2.5"/>
  <text x="688" y="300" text-anchor="middle" font-size="19" fill="#8a949e" transform="rotate(90 688 300)">skip connection (identity)</text>

  <!-- into encoder -->
  <line x1="330" y1="118" x2="330" y2="160" stroke="#3a444e" stroke-width="3" marker-end="url(#pArr)"/>

  <!-- causal encoder -->
  <rect x="150" y="167" width="360" height="100" rx="10" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2.5"/>
  <text x="330" y="207" text-anchor="middle" font-size="24" font-weight="bold" fill="#16344c">causal Transformer encoder</text>
  <text x="330" y="238" text-anchor="middle" font-size="20" fill="#16344c">3 pre-norm blocks, causal mask</text>

  <line x1="330" y1="267" x2="330" y2="309" stroke="#3a444e" stroke-width="3" marker-end="url(#pArr)"/>

  <!-- residual head -->
  <rect x="195" y="316" width="270" height="66" rx="10" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2.5"/>
  <text x="330" y="357" text-anchor="middle" font-size="22" fill="#16344c">linear head &#8594; residual &#916;</text>

  <line x1="330" y1="382" x2="330" y2="474" stroke="#3a444e" stroke-width="3" marker-end="url(#pArr)"/>
  <text x="200" y="435" text-anchor="middle" font-size="19" fill="#5a6673">&#916; &#8776; 0 on untouched dims</text>

  <!-- plus circle -->
  <circle cx="330" cy="500" r="20" fill="#ffffff" stroke="#3a444e" stroke-width="2.5"/>
  <line x1="330" y1="489" x2="330" y2="511" stroke="#3a444e" stroke-width="2.5"/>
  <line x1="319" y1="500" x2="341" y2="500" stroke="#3a444e" stroke-width="2.5"/>

  <line x1="330" y1="520" x2="330" y2="548" stroke="#3a444e" stroke-width="3" marker-end="url(#pArr)"/>

  <!-- output token row -->
  <g stroke-width="2">
    <rect x="180" y="555" width="44" height="44" fill="#f7f9fa" stroke="#5a6673"/>
    <rect x="230" y="555" width="44" height="44" fill="#f7f9fa" stroke="#5a6673"/>
    <rect x="280" y="555" width="44" height="44" fill="#cdeae6" stroke="#2a9d8f"/>
    <rect x="330" y="555" width="44" height="44" fill="#f7f9fa" stroke="#5a6673"/>
    <rect x="380" y="555" width="44" height="44" fill="#cdeae6" stroke="#2a9d8f"/>
    <rect x="430" y="555" width="44" height="44" fill="#f7f9fa" stroke="#5a6673"/>
  </g>
  <text x="330" y="630" text-anchor="middle" font-size="23" fill="#1a1a1a">purified flow  x&#8242; = x + &#916;</text>
</svg>
