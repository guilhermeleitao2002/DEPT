<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 850" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#3a444e"/>
    </marker>
  </defs>

  <!-- dataset cylinder -->
  <g>
    <rect x="210" y="58" width="220" height="80" fill="#eef1f4" stroke="none"/>
    <line x1="210" y1="58" x2="210" y2="138" stroke="#5a6673" stroke-width="2.5"/>
    <line x1="430" y1="58" x2="430" y2="138" stroke="#5a6673" stroke-width="2.5"/>
    <ellipse cx="320" cy="138" rx="110" ry="18" fill="#eef1f4" stroke="#5a6673" stroke-width="2.5"/>
    <ellipse cx="320" cy="58" rx="110" ry="18" fill="#f7f9fa" stroke="#5a6673" stroke-width="2.5"/>
    <text x="320" y="112" text-anchor="middle" font-size="26" fill="#1a1a1a">training data</text>
  </g>

  <!-- arrows to samples -->
  <line x1="252" y1="150" x2="130" y2="232" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="320" y1="160" x2="320" y2="232" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="388" y1="150" x2="510" y2="232" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>

  <!-- bootstrap samples -->
  <g>
    <rect x="45"  y="240" width="150" height="70" rx="10" fill="#d9ebe4" stroke="#257a68" stroke-width="2.5"/>
    <text x="120" y="268" text-anchor="middle" font-size="19" fill="#14483d">bootstrap</text>
    <text x="120" y="294" text-anchor="middle" font-size="22" fill="#14483d">sample 1</text>
    <rect x="245" y="240" width="150" height="70" rx="10" fill="#d9ebe4" stroke="#257a68" stroke-width="2.5"/>
    <text x="320" y="268" text-anchor="middle" font-size="19" fill="#14483d">bootstrap</text>
    <text x="320" y="294" text-anchor="middle" font-size="22" fill="#14483d">sample 2</text>
    <rect x="445" y="240" width="150" height="70" rx="10" fill="#d9ebe4" stroke="#257a68" stroke-width="2.5"/>
    <text x="520" y="268" text-anchor="middle" font-size="19" fill="#14483d">bootstrap</text>
    <text x="520" y="294" text-anchor="middle" font-size="22" fill="#14483d">sample 3</text>
  </g>
  <text x="320" y="345" text-anchor="middle" font-size="19" font-style="italic" fill="#5a6673">resampling with replacement</text>

  <!-- arrows to models -->
  <line x1="120" y1="315" x2="120" y2="382" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="320" y1="360" x2="320" y2="382" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="520" y1="315" x2="520" y2="382" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>

  <!-- tree models -->
  <g>
    <rect x="45" y="390" width="150" height="120" rx="10" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2.5"/>
    <g stroke="#2c5f8a" stroke-width="2">
      <line x1="120" y1="418" x2="96"  y2="446"/>
      <line x1="120" y1="418" x2="144" y2="446"/>
      <line x1="96"  y1="446" x2="82"  y2="472"/>
      <line x1="96"  y1="446" x2="110" y2="472"/>
      <line x1="144" y1="446" x2="130" y2="472"/>
      <line x1="144" y1="446" x2="158" y2="472"/>
    </g>
    <g fill="#f7f9fa" stroke="#2c5f8a" stroke-width="2">
      <circle cx="120" cy="418" r="8"/>
      <circle cx="96"  cy="446" r="8"/>
      <circle cx="144" cy="446" r="8"/>
      <circle cx="82"  cy="472" r="8"/>
      <circle cx="110" cy="472" r="8"/>
      <circle cx="130" cy="472" r="8"/>
      <circle cx="158" cy="472" r="8"/>
    </g>
    <text x="120" y="500" text-anchor="middle" font-size="21" fill="#16344c">tree 1</text>
  </g>
  <g>
    <rect x="245" y="390" width="150" height="120" rx="10" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2.5"/>
    <g stroke="#2c5f8a" stroke-width="2">
      <line x1="320" y1="418" x2="296" y2="446"/>
      <line x1="320" y1="418" x2="344" y2="446"/>
      <line x1="296" y1="446" x2="282" y2="472"/>
      <line x1="296" y1="446" x2="310" y2="472"/>
      <line x1="344" y1="446" x2="330" y2="472"/>
      <line x1="344" y1="446" x2="358" y2="472"/>
    </g>
    <g fill="#f7f9fa" stroke="#2c5f8a" stroke-width="2">
      <circle cx="320" cy="418" r="8"/>
      <circle cx="296" cy="446" r="8"/>
      <circle cx="344" cy="446" r="8"/>
      <circle cx="282" cy="472" r="8"/>
      <circle cx="310" cy="472" r="8"/>
      <circle cx="330" cy="472" r="8"/>
      <circle cx="358" cy="472" r="8"/>
    </g>
    <text x="320" y="500" text-anchor="middle" font-size="21" fill="#16344c">tree 2</text>
  </g>
  <g>
    <rect x="445" y="390" width="150" height="120" rx="10" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2.5"/>
    <g stroke="#2c5f8a" stroke-width="2">
      <line x1="520" y1="418" x2="496" y2="446"/>
      <line x1="520" y1="418" x2="544" y2="446"/>
      <line x1="496" y1="446" x2="482" y2="472"/>
      <line x1="496" y1="446" x2="510" y2="472"/>
      <line x1="544" y1="446" x2="530" y2="472"/>
      <line x1="544" y1="446" x2="558" y2="472"/>
    </g>
    <g fill="#f7f9fa" stroke="#2c5f8a" stroke-width="2">
      <circle cx="520" cy="418" r="8"/>
      <circle cx="496" cy="446" r="8"/>
      <circle cx="544" cy="446" r="8"/>
      <circle cx="482" cy="472" r="8"/>
      <circle cx="510" cy="472" r="8"/>
      <circle cx="530" cy="472" r="8"/>
      <circle cx="558" cy="472" r="8"/>
    </g>
    <text x="520" y="500" text-anchor="middle" font-size="21" fill="#16344c">tree 3</text>
  </g>
  <text x="320" y="546" text-anchor="middle" font-size="19" font-style="italic" fill="#5a6673">same model type, trained in parallel</text>

  <!-- arrows converge -->
  <line x1="120" y1="515" x2="238" y2="622" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="320" y1="560" x2="320" y2="618" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="520" y1="515" x2="402" y2="622" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>

  <!-- combiner -->
  <rect x="170" y="626" width="300" height="70" rx="12" fill="#f6e8cd" stroke="#a2721f" stroke-width="3"/>
  <text x="320" y="670" text-anchor="middle" font-size="24" fill="#5e430f">average / majority vote</text>

  <!-- prediction -->
  <line x1="320" y1="696" x2="320" y2="736" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="230" y="742" width="180" height="56" rx="12" fill="#eef1f4" stroke="#5a6673" stroke-width="2.5"/>
  <text x="320" y="778" text-anchor="middle" font-size="24" fill="#1a1a1a">prediction</text>
</svg>
