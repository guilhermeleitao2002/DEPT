<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1150" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#3a444e"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#c44536"/>
    </marker>
    <marker id="arrTeal" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#2a9d8f"/>
    </marker>
    <marker id="arrGrey" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#8a949e"/>
    </marker>
  </defs>

  <!-- input traffic -->
  <g>
    <rect x="650" y="30" width="220" height="58" fill="#eef1f4" stroke="none"/>
    <line x1="650" y1="30" x2="650" y2="88" stroke="#5a6673" stroke-width="2.5"/>
    <line x1="870" y1="30" x2="870" y2="88" stroke="#5a6673" stroke-width="2.5"/>
    <ellipse cx="760" cy="88" rx="110" ry="15" fill="#eef1f4" stroke="#5a6673" stroke-width="2.5"/>
    <ellipse cx="760" cy="30" rx="110" ry="15" fill="#f7f9fa" stroke="#5a6673" stroke-width="2.5"/>
    <text x="760" y="70" text-anchor="middle" font-size="24" fill="#1a1a1a">network traffic</text>
  </g>
  <line x1="760" y1="105" x2="760" y2="138" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>

  <!-- packet-to-tensor -->
  <rect x="560" y="145" width="400" height="92" rx="10" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2.5"/>
  <text x="760" y="183" text-anchor="middle" font-size="26" font-weight="bold" fill="#16344c">Packet-to-Tensor pipeline</text>
  <text x="760" y="215" text-anchor="middle" font-size="22" fill="#16344c">masked nPrint bits + IPAT + direction</text>

  <!-- branch arrows -->
  <line x1="640" y1="237" x2="400" y2="288" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="880" y1="237" x2="1120" y2="288" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>

  <!-- left stream note -->
  <rect x="215" y="295" width="330" height="76" rx="8" fill="#f7f9fa" stroke="#5a6673" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="380" y="327" text-anchor="middle" font-size="22" fill="#1a1a1a">per-packet tokens  [L &#215; 1090]</text>
  <text x="380" y="356" text-anchor="middle" font-size="21" fill="#5a6673">one row per packet</text>

  <!-- right stream note -->
  <rect x="975" y="295" width="330" height="76" rx="8" fill="#f7f9fa" stroke="#5a6673" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="1140" y="327" text-anchor="middle" font-size="22" fill="#1a1a1a">prefix statistics  [C &#215; 24]</text>
  <text x="1140" y="356" text-anchor="middle" font-size="21" fill="#5a6673">one row per checkpoint</text>

  <line x1="380" y1="371" x2="380" y2="403" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="1140" y1="371" x2="1140" y2="403" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>

  <!-- TCN box -->
  <rect x="230" y="410" width="300" height="110" rx="10" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2.5"/>
  <text x="380" y="450" text-anchor="middle" font-size="26" font-weight="bold" fill="#16344c">TCN</text>
  <text x="380" y="479" text-anchor="middle" font-size="21" fill="#16344c">causal dilated convolutions</text>
  <text x="380" y="505" text-anchor="middle" font-size="21" fill="#16344c">logit at every packet</text>

  <!-- RF box -->
  <rect x="990" y="410" width="300" height="110" rx="10" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2.5"/>
  <text x="1140" y="450" text-anchor="middle" font-size="26" font-weight="bold" fill="#16344c">Random Forest</text>
  <text x="1140" y="479" text-anchor="middle" font-size="21" fill="#16344c">trees over prefix statistics</text>
  <text x="1140" y="505" text-anchor="middle" font-size="21" fill="#16344c">logit at packet 2, then every 10th</text>

  <!-- merge into fusion tokens -->
  <path d="M380,520 V550 H690 V580" fill="none" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M1140,520 V550 H830 V580" fill="none" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>
  <text x="530" y="543" text-anchor="middle" font-size="20" fill="#5a6673">dense stream</text>
  <text x="990" y="543" text-anchor="middle" font-size="20" fill="#5a6673">sparse stream, carried forward</text>

  <rect x="610" y="587" width="300" height="64" rx="8" fill="#f7f9fa" stroke="#5a6673" stroke-width="2"/>
  <text x="760" y="627" text-anchor="middle" font-size="22" fill="#1a1a1a">fusion tokens  [L &#215; 13]</text>

  <line x1="760" y1="651" x2="760" y2="683" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>

  <!-- meta-learner -->
  <rect x="610" y="690" width="300" height="104" rx="10" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2.5"/>
  <text x="760" y="728" text-anchor="middle" font-size="26" font-weight="bold" fill="#16344c">Meta-learner</text>
  <text x="760" y="757" text-anchor="middle" font-size="21" fill="#16344c">causal mini-Transformer</text>
  <text x="760" y="782" text-anchor="middle" font-size="21" fill="#16344c">P(adv) at every packet</text>

  <line x1="760" y1="794" x2="760" y2="826" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>

  <!-- decision diamond -->
  <polygon points="760,833 875,893 760,953 645,893" fill="#f7f9fa" stroke="#5a6673" stroke-width="2.5"/>
  <text x="760" y="902" text-anchor="middle" font-size="23" fill="#1a1a1a">adversarial?</text>

  <!-- no branch -->
  <line x1="875" y1="893" x2="1135" y2="893" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>
  <text x="1002" y="874" text-anchor="middle" font-size="21" fill="#3a444e">no: forward unchanged</text>

  <!-- yes branch -->
  <line x1="760" y1="953" x2="760" y2="988" stroke="#c44536" stroke-width="3" marker-end="url(#arrRed)"/>
  <text x="800" y="978" text-anchor="start" font-size="21" fill="#7a4a44">yes</text>

  <!-- reconstructor -->
  <rect x="610" y="995" width="300" height="90" rx="10" fill="#dff0ed" stroke="#2a9d8f" stroke-width="2.5"/>
  <text x="760" y="1032" text-anchor="middle" font-size="26" font-weight="bold" fill="#14544c">Reconstructor</text>
  <text x="760" y="1061" text-anchor="middle" font-size="21" fill="#14544c">causal purification Transformer</text>

  <!-- purification to realization, on the inference path -->
  <line x1="910" y1="1040" x2="968" y2="1040" stroke="#2a9d8f" stroke-width="3" marker-end="url(#arrTeal)" stroke-dasharray="8,6"/>

  <!-- realization -->
  <rect x="975" y="995" width="335" height="90" rx="10" fill="#dff0ed" stroke="#2a9d8f" stroke-width="2.5"/>
  <text x="1142" y="1026" text-anchor="middle" font-size="25" font-weight="bold" fill="#14544c">Realization &#936;</text>
  <text x="1142" y="1052" text-anchor="middle" font-size="20" fill="#14544c">purified packets rebuilt</text>
  <text x="1142" y="1074" text-anchor="middle" font-size="17" fill="#14544c">size and timing only</text>

  <!-- purified to NIDS -->
  <path d="M1310,1040 H1340 V972" fill="none" stroke="#2a9d8f" stroke-width="3" marker-end="url(#arrTeal)"/>

  <!-- tshark validation, off the inference path -->
  <path d="M1142,1085 V1118 H380 V1088" fill="none" stroke="#8a949e" stroke-width="2.5" stroke-dasharray="8,6" marker-end="url(#arrGrey)"/>
  <text x="760" y="1110" text-anchor="middle" font-size="20" fill="#8a949e">off the inference path</text>
  <rect x="215" y="1000" width="330" height="80" rx="8" fill="#ffffff" stroke="#8a949e" stroke-width="2" stroke-dasharray="8,6"/>
  <text x="380" y="1033" text-anchor="middle" font-size="21" fill="#5a6673">tshark dissection check</text>
  <text x="380" y="1061" text-anchor="middle" font-size="21" fill="#5a6673">(protocol compliance)</text>

  <!-- protected NIDS -->
  <rect x="1140" y="855" width="230" height="110" rx="12" fill="#f3f9f7" stroke="#2a9d8f" stroke-width="3"/>
  <path d="M1332,872 l14,5 v12 q0,14 -14,19 q-14,-5 -14,-19 v-12 Z" fill="#2a9d8f"/>
  <text x="1245" y="905" text-anchor="middle" font-size="25" font-weight="bold" fill="#1a1a1a">protected</text>
  <text x="1245" y="935" text-anchor="middle" font-size="25" font-weight="bold" fill="#1a1a1a">NIDS</text>
</svg>
