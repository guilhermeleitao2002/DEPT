<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 960 530" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#3a444e"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#8a939c"/>
    </marker>
  </defs>

  <!-- ============ labelled training flows ============ -->
  <text x="221" y="72" text-anchor="middle" font-size="28" font-weight="bold" fill="#1a1a1a">labelled training flows</text>

  <!-- row 1: benign -->
  <g>
    <rect x="40"  y="110" width="36" height="36" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <rect x="83"  y="110" width="36" height="36" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <rect x="126" y="110" width="36" height="36" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <rect x="169" y="110" width="36" height="36" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <rect x="212" y="110" width="36" height="36" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <rect x="262" y="108" width="140" height="40" rx="10" fill="#d9ebe4" stroke="#257a68" stroke-width="2.5"/>
    <text x="332" y="136" text-anchor="middle" font-size="24" fill="#14483d">benign</text>
  </g>
  <!-- row 2: malicious -->
  <g>
    <rect x="40"  y="220" width="36" height="36" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <rect x="83"  y="220" width="36" height="36" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <rect x="126" y="220" width="36" height="36" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <rect x="169" y="220" width="36" height="36" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <rect x="212" y="220" width="36" height="36" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <rect x="262" y="218" width="140" height="40" rx="10" fill="#f2d8d3" stroke="#b0453a" stroke-width="2.5"/>
    <text x="332" y="246" text-anchor="middle" font-size="24" fill="#7c2c23">malicious</text>
  </g>
  <!-- row 3: benign -->
  <g>
    <rect x="40"  y="330" width="36" height="36" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <rect x="83"  y="330" width="36" height="36" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <rect x="126" y="330" width="36" height="36" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <rect x="169" y="330" width="36" height="36" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <rect x="212" y="330" width="36" height="36" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <rect x="262" y="328" width="140" height="40" rx="10" fill="#d9ebe4" stroke="#257a68" stroke-width="2.5"/>
    <text x="332" y="356" text-anchor="middle" font-size="24" fill="#14483d">benign</text>
  </g>
  <text x="144" y="404" text-anchor="middle" font-size="20" font-style="italic" fill="#5a6673">one flow = packet sequence</text>

  <!-- arrow to model -->
  <line x1="418" y1="245" x2="462" y2="245" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>

  <!-- model -->
  <rect x="470" y="175" width="240" height="140" rx="14" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="3"/>
  <text x="590" y="235" text-anchor="middle" font-size="28" fill="#16344c">detection model</text>
  <text x="590" y="277" text-anchor="middle" font-size="24" font-style="italic" fill="#2c5f8a">f : flow &#8594; label</text>

  <!-- arrow to prediction -->
  <line x1="710" y1="245" x2="752" y2="245" stroke="#3a444e" stroke-width="3" marker-end="url(#arr)"/>

  <!-- prediction chip -->
  <text x="845" y="188" text-anchor="middle" font-size="20" fill="#5a6673">prediction</text>
  <rect x="760" y="200" width="170" height="46" rx="10" fill="#f2d8d3" stroke="#b0453a" stroke-width="2.5"/>
  <text x="845" y="231" text-anchor="middle" font-size="24" fill="#7c2c23">malicious</text>

  <!-- true label chip -->
  <text x="845" y="292" text-anchor="middle" font-size="20" fill="#5a6673">true label</text>
  <rect x="760" y="304" width="170" height="46" rx="10" fill="#f2d8d3" stroke="#b0453a" stroke-width="2.5"/>
  <text x="845" y="335" text-anchor="middle" font-size="24" fill="#7c2c23">malicious</text>

  <!-- feedback loop -->
  <path d="M 845 360 L 845 470 L 590 470 L 590 325" fill="none" stroke="#8a939c" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrg)"/>
  <text x="717" y="505" text-anchor="middle" font-size="21" font-style="italic" fill="#5a6673">compare prediction with label;</text>
  <text x="717" y="533" text-anchor="middle" font-size="21" font-style="italic" fill="#5a6673">adjust model parameters</text>
</svg>
