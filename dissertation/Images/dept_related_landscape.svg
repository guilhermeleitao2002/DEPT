<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 625" font-family="Helvetica, Arial, sans-serif">

  <!-- phase labels, one bracket per group of columns -->
  <text x="395" y="32" text-anchor="middle" font-size="23" font-style="italic" fill="#5a6673">training time</text>
  <path d="M178,52 V44 H612 V52" fill="none" stroke="#5a6673" stroke-width="1.5"/>
  <text x="745" y="32" text-anchor="middle" font-size="22" font-style="italic" fill="#5a6673">training + inference</text>
  <path d="M648,52 V44 H842 V52" fill="none" stroke="#5a6673" stroke-width="1.5"/>
  <text x="1160" y="32" text-anchor="middle" font-size="23" font-style="italic" fill="#5a6673">inference time</text>
  <path d="M878,52 V44 H1442 V52" fill="none" stroke="#5a6673" stroke-width="1.5"/>

  <!-- column headers (what the defense does) -->
  <text x="395" y="88" text-anchor="middle" font-size="30" font-weight="bold" fill="#3a444e">harden the model</text>
  <text x="745" y="88" text-anchor="middle" font-size="30" font-weight="bold" fill="#3a444e">certify</text>
  <text x="990" y="88" text-anchor="middle" font-size="30" font-weight="bold" fill="#3a444e">detect</text>
  <text x="1290" y="88" text-anchor="middle" font-size="30" font-weight="bold" fill="#3a444e">purify</text>

  <!-- outer frame -->
  <rect x="160" y="102" width="1300" height="503" fill="none" stroke="#3a444e" stroke-width="2.5"/>
  <!-- internal separators -->
  <line x1="630" y1="102" x2="630" y2="605" stroke="#5a6673" stroke-width="2" stroke-dasharray="9,7"/>
  <line x1="860" y1="102" x2="860" y2="605" stroke="#5a6673" stroke-width="2" stroke-dasharray="9,7"/>
  <line x1="1120" y1="102" x2="1120" y2="605" stroke="#8a95a1" stroke-width="1.5" stroke-dasharray="5,6"/>
  <line x1="160" y1="272" x2="1460" y2="272" stroke="#5a6673" stroke-width="2" stroke-dasharray="9,7"/>

  <!-- row labels (space axis) -->
  <text transform="rotate(-90 120 187)" x="120" y="187" text-anchor="middle" font-size="30" font-weight="bold" fill="#3a444e">traffic-space</text>
  <text transform="rotate(-90 120 438)" x="120" y="438" text-anchor="middle" font-size="30" font-weight="bold" fill="#3a444e">feature-space</text>

  <!-- ============ traffic-space row ============ -->
  <!-- PANTS: adversarial training with realizable examples -->
  <g>
    <rect x="290" y="151" width="210" height="72" rx="12" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2.5"/>
    <text x="395" y="184" text-anchor="middle" font-size="27" fill="#1a1a1a">PANTS '25</text>
    <text x="395" y="211" text-anchor="middle" font-size="21" fill="#3a444e">(adv. training)</text>
  </g>

  <!-- CertTA: randomized smoothing over packet timing, size and insertion -->
  <g>
    <rect x="645" y="151" width="200" height="72" rx="12" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2.5"/>
    <text x="745" y="184" text-anchor="middle" font-size="27" fill="#1a1a1a">CertTA '25</text>
    <text x="745" y="211" text-anchor="middle" font-size="21" fill="#3a444e">(smoothing)</text>
  </g>

  <!-- DEPT: detection and purification, inference time only -->
  <g>
    <rect x="878" y="128" width="564" height="120" rx="14" fill="#dff0ed" stroke="#2a9d8f" stroke-width="4"/>
    <text x="1160" y="168" text-anchor="middle" font-size="30" font-weight="bold" fill="#1a1a1a">DEPT (this thesis)</text>
    <text x="1160" y="202" text-anchor="middle" font-size="23" fill="#3a444e">detects the manipulation and undoes it,</text>
    <text x="1160" y="231" text-anchor="middle" font-size="23" fill="#3a444e">returning valid packets to an unchanged NIDS</text>
  </g>

  <!-- ============ feature-space row ============ -->
  <!-- harden the model: blue = network domain, grey = outside it -->
  <g>
    <rect x="178" y="298" width="212" height="56" rx="12" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2.5"/>
    <text x="284" y="334" text-anchor="middle" font-size="25" fill="#1a1a1a">Antidote '09</text>
  </g>
  <g>
    <rect x="410" y="298" width="212" height="56" rx="12" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2.5"/>
    <text x="516" y="334" text-anchor="middle" font-size="25" fill="#1a1a1a">Bagging '11/'22</text>
  </g>
  <g>
    <rect x="178" y="374" width="212" height="56" rx="12" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2.5"/>
    <text x="284" y="410" text-anchor="middle" font-size="25" fill="#1a1a1a">Tiki-Taka '20</text>
  </g>
  <g>
    <rect x="410" y="374" width="212" height="56" rx="12" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <text x="516" y="410" text-anchor="middle" font-size="25" fill="#5a6673">TRS '21</text>
  </g>
  <g>
    <rect x="178" y="450" width="212" height="56" rx="12" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <text x="284" y="486" text-anchor="middle" font-size="25" fill="#5a6673">CrowdGuard '24</text>
  </g>
  <g>
    <rect x="410" y="450" width="212" height="56" rx="12" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <text x="516" y="486" text-anchor="middle" font-size="25" fill="#5a6673">PBP '25</text>
  </g>

  <!-- certify -->
  <g>
    <rect x="645" y="298" width="200" height="56" rx="12" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <text x="745" y="334" text-anchor="middle" font-size="25" fill="#5a6673">LipsLev '25</text>
  </g>

  <!-- detect -->
  <g>
    <rect x="880" y="298" width="220" height="56" rx="12" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2.5"/>
    <text x="990" y="334" text-anchor="middle" font-size="25" fill="#1a1a1a">NIDS-CBAD '25</text>
  </g>
  <g>
    <rect x="880" y="374" width="220" height="56" rx="12" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2.5"/>
    <text x="990" y="410" text-anchor="middle" font-size="25" fill="#1a1a1a">AMDS '26</text>
  </g>

  <!-- purify -->
  <g>
    <rect x="1140" y="298" width="300" height="56" rx="12" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <text x="1290" y="334" text-anchor="middle" font-size="25" fill="#5a6673">Defense-GAN '18</text>
  </g>
  <g>
    <rect x="1140" y="374" width="300" height="56" rx="12" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2.5"/>
    <text x="1290" y="410" text-anchor="middle" font-size="25" fill="#1a1a1a">AdvPurRec '24</text>
  </g>
  <g>
    <rect x="1140" y="450" width="300" height="56" rx="12" fill="#d7e4f2" stroke="#2c5f8a" stroke-width="2.5"/>
    <text x="1290" y="486" text-anchor="middle" font-size="25" fill="#1a1a1a">Merzouk et al. '25</text>
  </g>
  <!-- image / text diffusion purifiers, muted -->
  <g>
    <rect x="1140" y="526" width="300" height="40" rx="10" fill="#eef1f4" stroke="#5a6673" stroke-width="2"/>
    <text x="1290" y="553" text-anchor="middle" font-size="20" fill="#5a6673">ADBM &#183; CausalDiff &#183; DiffuseDef</text>
  </g>

</svg>
